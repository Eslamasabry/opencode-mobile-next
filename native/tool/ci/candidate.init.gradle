// A candidate needs fresh Test execution; compilation/dependency caches remain usable.
allprojects {
    tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        maxParallelForks = 1
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
        // A *Renders class writes pictures for a person to look at and asserts nothing: it is not a check, so the
        // candidate lane leaves it out by name; the build server's render queue runs them (vtest.sh --tests '*Renders*').
        filter.excludeTestsMatching("*Renders")
    }
}

# From Conversations: switch to the saved server whose name matches NAME (a regex), via the top bar's server
# switcher (Flutter 2.1.4: "<server>, Connected, Switch server" opens a "Servers" sheet). env: NAME
appId: ${APP_ID}
---
- tapOn: ${'(?s).*' + output.s.kitTopBarSwitchServer}  # literal-ok: the top bar reads "<server>, <state>, Switch server"
- tapOn: ${NAME + '(\n(?s).*)?'}  # literal-ok: the caller's server name regex
- extendedWaitUntil:
    visible: ${output.s.chatsHomeAllProjects}
    timeout: 30000

# Native: Settings > This app > Appearance, and check the kept choices.
# Upgrade-proof branch: since 1f5a047bde (2026-11-10) Appearance is one page with a preview and four tabs (Colours,
# Style, Background, Text & motion); each tab shows its options as segmented choices, the kept one selected.
appId: ${APP_ID}
---
- tapOn: ${output.s.settingsHubGroupThisApp + '(\n(?s).*)?'}
- tapOn: ${output.s.e7AppearanceTitle + '(\n(?s).*)?'}
- extendedWaitUntil:
    visible: ${output.s.appearanceGroupComfort}
    timeout: 15000
- runFlow:
    label: "APPEARANCE text size kept"
    commands:
      - tapOn: ${output.s.appearanceGroupComfort}
      - scrollUntilVisible:
          element:
            text: ${output.s.textSizeSmallest + '(\n(?s).*)?'}
          direction: DOWN
          timeout: 10000
      - takeScreenshot: native-appearance-text
      - assertVisible:
          text: ${output.s.textSizeSmallest + '(\n(?s).*)?'}
          selected: true
- runFlow:
    label: "APPEARANCE style kept"
    commands:
      - tapOn: ${output.s.appearanceGroupStyle}
      - scrollUntilVisible:
          element:
            text: ${output.s.appearanceSurfaceSoft + '(\n(?s).*)?'}
          direction: DOWN
          timeout: 10000
      - takeScreenshot: native-appearance-style
      - assertVisible:
          text: ${output.s.appearanceSurfaceSoft + '(\n(?s).*)?'}
          selected: true
      - scrollUntilVisible:
          element:
            text: ${output.s.appearanceFineTuneCornersSharp + '(\n(?s).*)?'}
          direction: DOWN
          timeout: 10000
      - assertVisible:
          text: ${output.s.appearanceFineTuneCornersSharp + '(\n(?s).*)?'}
          selected: true

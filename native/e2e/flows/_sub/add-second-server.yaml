# From Conversations: Settings > Server > Servers > Add server, connect FX-OC2-B, open it (back on Conversations,
# now showing FX-OC2-B). Walked on Flutter 2.1.4 (2026-11-07).
appId: ${APP_ID}
---
- runFlow: open-settings.yaml
- runFlow: open-servers.yaml
- tapOn: ${output.s.e7SetupAddServer}
- runFlow:
    file: server-form.yaml
    env:
      ADDRESS: ${output.fx.serverBUrl}
      PASSWORD: ${SERVER_B_PASSWORD}
- extendedWaitUntil:
    visible: ${output.rc.e7SetupProbeV2}
    timeout: 30000
- tapOn: ${output.s.onboardingSaveConnect}
- extendedWaitUntil:
    visible: ${output.re.addServerReadyOpen}
    timeout: 30000
- tapOn: ${output.re.addServerReadyOpen}
- extendedWaitUntil:
    visible: ${output.s.chatsHomeTitle}
    timeout: 30000

# Press Back until the Conversations list shows (at most 6 times): leaves any Settings depth or search state.
# The top bar's "<server>, <state>, Switch server" marks the list: "Conversations" alone also names a Settings group,
# and an empty list (the phone's first project) has no "All projects".
appId: ${APP_ID}
---
- repeat:
    times: 6
    while:
      notVisible: ${'(?s).+, ' + output.s.kitTopBarSwitchServer}  # literal-ok: the top bar, from strings
    commands:
      - back
- assertVisible: ${'(?s).+, ' + output.s.kitTopBarSwitchServer}  # literal-ok: the top bar, from strings
- runFlow: dismiss-notices.yaml

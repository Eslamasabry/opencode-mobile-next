# E2E-39 Part C (assert), shared by both apps: everything Part A left is still there. It runs on the Flutter app as
# the baseline (Part B) and on the native app after the in-place install. It leaves the app as it found it (Arabic is
# switched back on at the end) so it can run twice. Each section records output.pc.<step> = true for the main flow.
# Strings come from the caller (strings.js already ran).
appId: ${APP_ID}
---
- evalScript: ${output.pc = {}}
# Each section runs as an optional runFlow labelled "PC ...": a section that fails is recorded (WARNED) and the
# next one starts again from Conversations, so one native gap does not hide the rest. Each records
# output.pc.<step>; E2E-39 judges the steps from those flags.

# Upgrade launch: Conversations (Arabic), not the welcome screen, no first-run guide or first-reply question.
- runFlow:
    label: "PC S4 conversations, no first run"
    optional: true
    commands:
      - launchApp
      - extendedWaitUntil:
          visible: ${output.s.x_ar_chats_home}
          timeout: 60000
      - assertNotVisible: ${output.s.welcomeComputerConnect}
      - takeScreenshot: ${(output.phase || 'flutter') + '-conversations'}
      - runFlow: ../../_sub/dismiss-notices.yaml
      - evalScript: ${output.pc.S4 = true}

# Language Arabic as set; switch to English for the checks below (restored at the end).
# Maestro cannot type Arabic (pasteText types the clipboard), so go by the Settings structure: Settings > This app
# > Language > English (Flutter 2.1.4).
- runFlow:
    label: "PC English for the checks"
    optional: true
    commands:
      - tapOn: ${output.s.x_ar_settings}
      - tapOn: ${output.s.x_ar_this_app}
      - tapOn: ${output.s.x_ar_language + '(\n(?s).*)?'}
      - tapOn: ${output.s.e7LocaleUiEnglish}
      - extendedWaitUntil:
          visible: ${output.s.settingsV3Language + '(\n(?s).*)?'}
          timeout: 15000
      - runFlow: ../../_sub/back-to-conversations.yaml

# Text Smallest, style Soft with the tweak, finished-work notifications on: nothing reset to defaults. Flutter 2.1.4
# (walked 2026-11-07) shows each choice in its Appearance chip ("Text size, Smallest, ...", "Shape, Sharp, Roomy,
# ...") and the text size under its slider ("Smallest, Text size").
- runFlow:
    label: "PC S5 settings kept"
    optional: true
    commands:
      - runFlow: ../../_sub/to-conversations.yaml
      - runFlow: ../../_sub/open-settings.yaml
      - runFlow:
          file: ../../_sub/settings-search.yaml
          env:
            QUERY: ${output.t.textSizeTitle}
      - tapOn:
          text: ${output.s.textSizeTitle + '(\n(?s).*)?'}
          index: 1
      - extendedWaitUntil:
          visible: ${output.s.textSizeSmallest + ', ' + output.s.textSizeTitle}
          timeout: 15000
      - runFlow:
          when:
            visible: ${output.s.tourNotNow}
          commands:
            - tapOn: ${output.s.tourNotNow}
      - tapOn: ${output.s.kitGuideBack}
      - assertVisible: ${output.s.appearanceChipStyle + '(\n|, )' + output.s.appearanceSurfaceSoft + '(?s).*'}
      - tapOn: ${output.s.appearanceChipStyle + '(\n|, )(?s).*'}
      - assertVisible: ${output.s.appearanceChipShape + ', ' + output.s.appearanceFineTuneCornersSharp + '(?s).*'}
      - runFlow: ../../_sub/back-to-conversations.yaml
      - runFlow: ../../_sub/open-settings.yaml
      - runFlow: ../../_sub/open-notifications.yaml
      - assertVisible:
          text: ${output.s.notifyFinishedRuns + '(\n(?s).*)?'}
          checked: true
      - runFlow: ../../_sub/back-to-conversations.yaml
      - evalScript: ${output.pc.S5 = true}

# FX-OC2 connected with no password prompt; the pinned certificate still in force.
- runFlow:
    label: "PC S6 servers"
    optional: true
    commands:
      - runFlow: ../../_sub/to-conversations.yaml
      - runFlow: ../../_sub/open-settings.yaml
      - runFlow: ../../_sub/open-servers.yaml
      - assertVisible: ${'(?s).*' + output.fx.serverAddress.replace(/\./g, '\\.') + '\n' + output.s.serverRowConnected + '(?s).*'}  # literal-ok: built from fixture data
      - assertNotVisible: ${output.s.e7SetupServerPassword + '(,(?s).*)?'}
      - assertNotVisible: ${output.c.e7SetupCertificate}
      - assertNotVisible: ${output.s.e7ConnectionFailure20}
      - takeScreenshot: ${(output.phase || 'flutter') + '-servers'}
      - runFlow: ../../_sub/back-to-conversations.yaml
      - evalScript: ${output.pc.S6 = true}

# Pins, the draft with its attachment, the saved prompt, the always-allow rule and the queued prompt.
- runFlow:
    label: "PC chat messages and draft"
    optional: true
    commands:
      - runFlow: ../../_sub/to-conversations.yaml
      - extendedWaitUntil:
          visible: "Upgrade pin one(, .*)?"  # literal-ok: title seeded in Part A
          timeout: 30000
      - assertVisible: "Upgrade pin two(, .*)?"  # literal-ok: title seeded in Part A
      - assertVisible: "Upgrade draft(, .*)?"  # literal-ok: title seeded in Part A
      - assertNotVisible: "(?s).*Upgrade pin one.*Upgrade pin one.*"  # literal-ok: nothing duplicated by the migration
      - tapOn: "Upgrade draft(, .*)?"  # literal-ok: title seeded in Part A
      - runFlow: ../../_sub/settle-chat.yaml
      - extendedWaitUntil:
          visible: ".*upgrade draft text.*"  # literal-ok: the draft typed in Part A (2.1.4: "@notes.txt upgrade draft text")
          timeout: 30000
      - assertVisible: ${'.*' + output.fx.fileNotes.replace(/\./g, '\\.') + '.*'}  # literal-ok: built from fixture data (the attachment chip)
      # The conversation still shows its earlier messages: the prompt Part A sent here.
      - assertVisible: ".*e2e:ask-shell ls.*"  # literal-ok: the prompt Part A sent in this conversation
      - takeScreenshot: ${(output.phase || 'flutter') + '-chat'}
      - evalScript: ${output.pc.chatMessages = true}

# 2.1.4: Attach and more > More > Prompts > Saved prompts.
- runFlow:
    label: "PC S7 saved prompt, rule, queued prompt"
    optional: true
    commands:
      - runFlow: ../../_sub/to-conversations.yaml
      - tapOn: "Upgrade draft(, .*)?"  # literal-ok: title seeded in Part A
      - runFlow: ../../_sub/settle-chat.yaml
      - runFlow: ../../_sub/composer-more-tools.yaml
      - runFlow:
          when:
            notVisible: ${output.s.promptStashTitle + '(?s).*'}
          commands:
            - tapOn: ${output.s.usagePrompts}
      - tapOn: ${output.s.promptStashTitle + '(?s).*'}
      - assertVisible: ".*upgrade saved prompt.*"  # literal-ok: the saved prompt from Part A
      - runFlow: ../../_sub/back-to-conversations.yaml
      - runFlow: ../../_sub/open-settings.yaml
      - runFlow:
          file: ../../_sub/settings-search.yaml
          env:
            QUERY: ${output.t.e7SettingsUi74}
      - tapOn:
          text: ${output.s.e7SettingsUi74 + '(\n(?s).*)?'}
          index: 1
      - assertVisible: "(?s).*\\bls\\b.*"  # literal-ok: the always-allowed shell command from Part A
      - runFlow: ../../_sub/back-to-conversations.yaml
      # The prompt queued for FX-OC2-B (still cut off) waits on this phone: 2.1.4 cannot open an unreachable server's
      # conversations, but its Servers row says "1 prompt waiting to send".
      - runFlow: ../../_sub/open-settings.yaml
      - runFlow: ../../_sub/open-servers.yaml
      - assertVisible: ${'(?s).*' + output.fx.serverBAddress.replace(/\./g, '\\.') + '\n' + output.re.serverRowQueuedWaiting + '(?s).*'}  # literal-ok: built from fixture data and strings
      - runFlow: ../../_sub/back-to-conversations.yaml
      # S7 also needs the draft, checked in the section before.
      - evalScript: ${output.pc.S7 = output.pc.chatMessages === true}

# A new prompt sends and its reply arrives. The prompt names the app under test, so Part B's reply never counts here.
- runFlow:
    label: "PC send prompt"
    optional: true
    commands:
      - runFlow: ../../_sub/to-conversations.yaml
      - tapOn: "Upgrade pin one(, .*)?"  # literal-ok: title seeded in Part A
      - runFlow: ../../_sub/settle-chat.yaml
      - extendedWaitUntil:
          visible: ${output.s.kitComposerField + '(?s).*'}
          timeout: 30000
      - runFlow:
          file: ../../_sub/send-prompt.yaml
          env:
            PROMPT: ${'e2e:echo sent on ' + (output.phase || 'flutter')}  # literal-ok: stub-model magic prompt
      - extendedWaitUntil:
          visible: ${'.*ECHO sent on ' + (output.phase || 'flutter') + '.*'}  # literal-ok: the stub model's reply
          timeout: 60000
      - takeScreenshot: ${(output.phase || 'flutter') + '-send'}
      - runFlow: ../../_sub/back-to-conversations.yaml
      - evalScript: ${output.pc.sendPrompt = true}

# Built-in Linux, the phone project and its server are there without reinstall; the server runs. Flutter 2.1.4:
# Settings > Server > This phone shows "Everything is running"; the phone's conversations hold the project my-app.
- runFlow:
    label: "PC S8 built-in Linux"
    optional: true
    commands:
      - runFlow: ../../_sub/to-conversations.yaml
      - runFlow: ../../_sub/open-settings.yaml
      - tapOn: ${output.s.settingsHubServer + '(\n(?s).*)?'}
      - tapOn: ${output.s.settingsV3ThisPhone + '(\n(?s).*)?'}
      - assertNotVisible: ${output.s.phoneSetupStartSetUp}
      - extendedWaitUntil:
          visible: ${output.c.thisPhoneAnswerRunning}
          timeout: 60000
      - takeScreenshot: ${(output.phase || 'flutter') + '-linux'}
      - runFlow: ../../_sub/back-to-conversations.yaml
      - evalScript: ${output.pc.S8 = true}

# `pwd && ls` in the phone's terminal. Flutter 2.1.4: a conversation's project chip > Files > More > Terminal opens
# the Built-in Linux terminal ("Runs on Built-in Linux"). Its screen text is not exposed to accessibility on 2.1.4,
# so the command's output is checked only where the app exposes it (optional) and shown in the screenshot.
- runFlow:
    label: "PC terminal"
    optional: true
    commands:
      - runFlow: ../../_sub/to-conversations.yaml
      - runFlow:
          file: ../../_sub/open-project-tools.yaml
          env:
            TITLE: "Upgrade pin one(, .*)?"  # literal-ok: title seeded in Part A
      - tapOn: ${output.s.libraryTerminalTitle}
      - runFlow:
          when:
            visible: ${output.s.terminalScreenUsePhone}
          commands:
            - tapOn: ${output.s.terminalScreenUsePhone}
      - runFlow:
          when:
            visible: ${output.s.localTerminalNewShell}
          commands:
            - tapOn: ${output.s.localTerminalNewShell}
      - extendedWaitUntil:
          visible: ${output.c.localTerminalSemantics}
          timeout: 60000
      - assertVisible: ${output.re.terminalPlaceSwitchLabel}
      - tapOn: ${output.c.localTerminalSemantics}
      - inputText: "pwd && ls"  # literal-ok: the shell command under test
      - pressKey: Enter
      - extendedWaitUntil:
          visible: ".*my-app.*"  # literal-ok: ls lists the phone project Part A created
          timeout: 15000
          optional: true
      - takeScreenshot: ${(output.phase || 'flutter') + '-terminal'}
      - stopApp
      - launchApp
      - runFlow: ../../_sub/back-to-conversations.yaml
      - evalScript: ${output.pc.terminal = true}

# The voice pack Part A set up is ready: Voice typing offers to remove it, not to download it.
- runFlow:
    label: "PC voice ready"
    optional: true
    commands:
      - runFlow: ../../_sub/to-conversations.yaml
      - runFlow: ../../_sub/open-settings.yaml
      - runFlow:
          file: ../../_sub/settings-search.yaml
          env:
            QUERY: ${output.t.voiceComponentTitle}
      - tapOn:
          text: ${output.s.voiceComponentTitle + '(\n(?s).*)?'}
          index: 1
      # Flutter 2.1.4's Voice typing page lists each speech model with its state: the pack Part A set up reads
      # "High accuracy\nInstalled · ...".
      - extendedWaitUntil:
          visible: ${output.s.e7VoiceUiAccurate + '\n' + output.s.e7VoiceUiInstalled + '(?s).*'}
          timeout: 15000
      - takeScreenshot: ${(output.phase || 'flutter') + '-voice'}
      - runFlow: ../../_sub/back-to-conversations.yaml
      - evalScript: ${output.pc.voiceReady = true}

# The scheduled prompt is still listed (2.1.4: conversation > project chip > Files > More > Scheduled prompts).
- runFlow:
    label: "PC schedule listed"
    optional: true
    commands:
      - runFlow: ../../_sub/to-conversations.yaml
      - runFlow:
          file: ../../_sub/open-project-tools.yaml
          env:
            TITLE: "Upgrade pin one(, .*)?"  # literal-ok: title seeded in Part A
      - tapOn: ${output.s.scheduleTitle}
      - extendedWaitUntil:
          visible: ".*e2e:echo daily upgrade.*"  # literal-ok: the schedule Part A made
          timeout: 15000
      - takeScreenshot: ${(output.phase || 'flutter') + '-schedule'}
      - evalScript: ${output.pc.scheduleListed = true}
      - runFlow: ../../_sub/back-to-conversations.yaml

# The draft's file chip is still on the draft. Part A's chip is a project file on FX-OC2 (2.1.4's "File from the
# project"), and 2.1.4 answers "Remote attachment previews are not available." when it is tapped, so opening a file
# from the old documents folder is not exercised here (it needs a local attachment in Part A).
- runFlow:
    label: "PC S9 draft file chip"
    optional: true
    commands:
      - runFlow: ../../_sub/to-conversations.yaml
      - tapOn: "Upgrade draft(, .*)?"  # literal-ok: title seeded in Part A
      - runFlow: ../../_sub/settle-chat.yaml
      - assertVisible: ${'.*' + output.fx.fileNotes.replace(/\./g, '\\.') + '.*'}  # literal-ok: built from fixture data (the attachment chip)
      - runFlow: ../../_sub/back-to-conversations.yaml
      - evalScript: ${output.pc.S9 = true}

# No password or token in the log (the runner also scrubs and scans after the run).
# adb: logcat-scan
- runFlow:
    label: "PC S11 no secret in log"
    optional: true
    commands:
      - runScript:
          file: ../../_hooks/adb.js
          env:
            HOOK: logcat-scan
      - assertTrue: ${output.hook.found == false}
      - evalScript: ${output.pc.S11 = true}

# The schedule still fires; the pinned shortcuts are published (and the widget redraws when one was placed).
# adb: clock-advance
- runFlow:
    label: "PC S12 schedule fires"
    optional: true
    commands:
      - runFlow: ../../_sub/to-conversations.yaml
      - runScript:
          file: ../../_hooks/adb.js
          env:
            HOOK: clock-advance
            ARGS: '{"advance_minutes": 1440}'
      - runFlow: ../../_sub/open-shade.yaml
      - extendedWaitUntil:
          visible: ${'(' + output.s.x_native_schedule_title + '|.*ECHO daily upgrade.*)'}  # literal-ok: the schedule's notification (title or the stub reply)
          timeout: 60000
      - runFlow: ../../_sub/close-shade.yaml
      # adb: clock-restore
      - runScript:
          file: ../../_hooks/adb.js
          env:
            HOOK: clock-restore
      - pressKey: Home
      - runFlow:
          when:
            visible: ${output.s.x_widget_conversations_title}
          commands:
            - assertVisible: "Upgrade pin one(, .*)?"  # literal-ok: the widget lists the seeded conversation
      # The pinned conversations' launcher shortcuts are not checked: Part A cannot pin on Flutter 2.1.4 (see there).
      - evalScript: ${output.pc.S12 = true}

# Leave it as found: Arabic again (and the clock back on automatic time, whatever S12 reached).
# adb: clock-restore
- runFlow:
    label: "PC back to Arabic"
    optional: true
    commands:
      # adb: clock-restore
      - runScript:
          file: ../../_hooks/adb.js
          env:
            HOOK: clock-restore
      - runFlow: ../../_sub/to-conversations.yaml
      - launchApp
      - runFlow: ../../_sub/open-settings.yaml
      - runFlow: ../../_sub/open-language.yaml
      - tapOn: ${output.s.e7LocaleUiArabic}
      - stopApp
      - launchApp
      - extendedWaitUntil:
          visible: ${output.s.x_ar_chats_home}
          timeout: 60000

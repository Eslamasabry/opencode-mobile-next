# E2E-39 Part A (seed), shared by both apps: run on the Flutter app from a clean install.
# Leaves: FX-OC2 connected with its password; FX-OC2-B saved, with a prompt queued for it while it is cut off (fx-proxy
# keeps it cut until the native app is checked); a self-signed FX-TLS server with a pinned certificate; finished-work
# notifications on; a draft with an attachment, a saved prompt (the composer's stash); two pinned conversations; an
# always-allow rule; built-in Linux with project app and its server running; a daily scheduled prompt; text Smallest,
# style Soft with sharp corners; the app language Arabic (set last, so every step above reads English).
# Strings come from the caller (strings.js already ran). Secrets: SERVER_PASSWORD, SERVER_B_PASSWORD.
appId: ${APP_ID}
tags: [linux-setup]
---
- launchApp:
    clearState: true
    stopApp: true
# adb: permission
- runScript:
    file: ../../_hooks/adb.js
    env:
      HOOK: permission
      ARGS: '{"perm": "POST_NOTIFICATIONS", "grant": true}'
# Exact alarms: without them 2.1.4 arms a schedule only through WorkManager (elapsed time), which Part C's clock
# jump cannot fire. A phone that had the app's schedule on had granted this.
# adb: appop
- runScript:
    file: ../../_hooks/adb.js
    env:
      HOOK: appop
      ARGS: '{"op": "SCHEDULE_EXACT_ALARM", "mode": "allow"}'
# Flutter 2.1.4 opens on "Where should your agent run?" with "On this phone" chosen; choosing the computer card
# turns the main button into "Connect to my computer" (connect-server.yaml taps it).
- extendedWaitUntil:
    visible: ${output.s.firstRunWhereQuestion}
    timeout: 30000
- tapOn: ${output.c.firstRunOnComputer}
- extendedWaitUntil:
    visible: ${output.s.welcomeComputerConnect}
    timeout: 10000
- runFlow:
    file: ../../_sub/connect-server.yaml
    env:
      ADDRESS: ${output.fx.serverUrl}
      PASSWORD: ${SERVER_PASSWORD}
# Conversations to pin and to hold the draft (titles are fixture data passed in ARGS).
- runScript:
    file: ../../_fx/fx.js
    env:
      TARGET: FX-OC2
      ACTION: seed-sessions
      ARGS: '{"project": "app", "titles": ["Upgrade pin one", "Upgrade pin two", "Upgrade draft"]}'
- runFlow: ../../_sub/restart-app.yaml
- extendedWaitUntil:
    visible: "Upgrade draft(, .*)?"  # literal-ok: title seeded through the fixture above
    timeout: 30000

# No pins: Flutter 2.1.4 has no pin action for a top-level conversation (walked 2026-11-07: a Conversations row
# has no long-press menu; "Pin {title}" exists only on the sub-agent list of a sub-agent conversation). Pins and the
# launcher shortcuts that follow them stay unseeded until they are seeded through storage (backlog).

# An always-allow rule, then a draft with an attachment and a saved prompt, in "Upgrade draft".
- tapOn: "Upgrade draft(, .*)?"  # literal-ok: title seeded through the fixture above
- extendedWaitUntil:
    visible: ${output.s.kitComposerField + '(?s).*'}
    timeout: 30000
- runFlow:
    file: ../../_sub/send-prompt.yaml
    env:
      PROMPT: "e2e:ask-shell ls"  # literal-ok: stub-model magic prompt
# 2.1.4: the request card offers "Always allow ls"; a sheet confirms "Always allow ls in this project?".
- extendedWaitUntil:
    visible: ${output.re.chatRequestAlwaysAllowNamed}
    timeout: 30000
- tapOn: ${output.re.chatRequestAlwaysAllowNamed}
- tapOn: ${output.s.chatUiAlwaysAllow}
- extendedWaitUntil:
    notVisible: ${output.re.chatRequestAlwaysAllowNamed}
    timeout: 30000
# 2.1.4 asks once, after the first reply, whether to notify when the agent needs you: yes.
- runFlow:
    when:
      visible: ${output.s.firstRunNotifyAccept}
    commands:
      - tapOn: ${output.s.firstRunNotifyAccept}
- tapOn: ${output.s.kitComposerField + '(?s).*'}
- inputText: "upgrade saved prompt"  # literal-ok: seed text
# 2.1.4: Attach and more > More > Prompts > Save prompt for later.
- runFlow: ../../_sub/composer-more-tools.yaml
- runFlow:
    when:
      notVisible: ${output.s.composerToolSaveForLater + '(?s).*'}
    commands:
      - tapOn: ${output.s.usagePrompts}
- tapOn: ${output.s.composerToolSaveForLater + '(?s).*'}
- extendedWaitUntil:
    visible: ${output.s.promptStashed}
    timeout: 15000
# The project file notes.txt on the draft: 2.1.4's More > File from the project opens the Project files sheet.
- runFlow: ../../_sub/composer-more-tools.yaml
- tapOn: ${output.s.mentionToolTitle + '(?s).*'}
- tapOn: ${'(?s).*' + output.fx.fileNotes.replace(/\./g, '\\.') + '.*'}  # literal-ok: built from fixture data
- tapOn: ${output.s.kitComposerField + '(?s).*'}
- inputText: "upgrade draft text"  # literal-ok: seed text left unsent as the draft
- hideKeyboard
- back

# A prompt queued for FX-OC2-B while it is cut off: it must still be queued, unsent, after the upgrade.
- runFlow: ../../_sub/add-second-server.yaml
- runScript:
    file: ../../_fx/fx.js
    env:
      TARGET: FX-OC2-B
      ACTION: seed-sessions
      ARGS: '{"project": "app", "titles": ["Upgrade queued"]}'
- runFlow: ../../_sub/restart-app.yaml
- extendedWaitUntil:
    visible: "Upgrade queued(, .*)?"  # literal-ok: title seeded through the fixture above
    timeout: 30000
# Open the conversation while FX-OC2-B answers (2.1.4 cannot open a conversation it never loaded), then cut it off.
- tapOn: "Upgrade queued(, .*)?"  # literal-ok: title seeded through the fixture above
- extendedWaitUntil:
    visible: ${output.s.kitComposerField + '(?s).*'}
    timeout: 30000
- runScript:
    file: ../../_fx/fx.js
    env:
      TARGET: fx-proxy
      ACTION: cut-host
      ARGS: "${JSON.stringify({host: output.fx.serverHost, port: parseInt(output.fx.serverBAddress.split(':')[1], 10)})}"
- runFlow:
    file: ../../_sub/send-prompt.yaml
    env:
      PROMPT: "e2e:echo queued once"  # literal-ok: stub-model magic prompt, must arrive exactly once
- extendedWaitUntil:
    visible: ${output.s.chatUiQueuedWillSendWhenReconnected}
    timeout: 30000
- hideKeyboard
- back

# A self-signed server whose certificate is pinned (same steps as E2E-04).
# FX-TLS fronts FX-OC2, so once it is opened Conversations shows FX-OC2's conversations again.
- runFlow: ../../_sub/open-settings.yaml
- runFlow: ../../_sub/open-servers.yaml
- tapOn: ${output.s.e7SetupAddServer}
- runFlow:
    file: ../../_sub/server-form.yaml
    env:
      ADDRESS: ${output.fx.tlsSelfSignedUrl}
      PASSWORD: ${SERVER_PASSWORD}
- extendedWaitUntil:
    visible: ${output.c.e7SetupCertificate}
    timeout: 30000
- tapOn: ${output.s.serverTrustCertificateInspect}
- tapOn: ${output.s.serverTrustCertificateAccept}
- extendedWaitUntil:
    visible: ${output.c.serverTrustCertificatePinned}
    timeout: 30000
- tapOn: ${output.s.onboardingSaveConnect}
- extendedWaitUntil:
    visible: ${output.re.addServerReadyOpen}
    timeout: 30000
- tapOn: ${output.re.addServerReadyOpen}
- extendedWaitUntil:
    visible: ${output.s.chatsHomeTitle}
    timeout: 60000
# Back to FX-OC2 itself: the draft, the always-allow rule and the schedule below belong to that saved server, and
# Part C reads them there.
- runFlow:
    file: ../../_sub/switch-server.yaml
    env:
      NAME: ${'(?s).*' + output.fx.serverAddress.replace(/\./g, '\\.')}  # literal-ok: built from fixture data

# Finished-work notifications on.
- runFlow: ../../_sub/open-settings.yaml
- runFlow: ../../_sub/open-notifications.yaml
- runFlow:
    when:
      visible:
        text: ${output.s.notifyFinishedRuns + '(\n(?s).*)?'}
        checked: false
    commands:
      - tapOn: ${output.s.notifyFinishedRuns + '(\n(?s).*)?'}
- runFlow: ../../_sub/back-to-conversations.yaml

# A daily scheduled prompt.
# 2.1.4 keeps Scheduled prompts with the project: conversation > project chip > Files > More > Scheduled prompts.
- runFlow:
    file: ../../_sub/open-project-tools.yaml
    env:
      TITLE: "Upgrade pin one(, .*)?"  # literal-ok: title seeded through the fixture above
- tapOn: ${output.s.scheduleTitle}
- tapOn: ${output.s.scheduleNew}
- tapOn: ${output.s.scheduleAsk + '(?s).*'}
- inputText: "e2e:echo daily upgrade"  # literal-ok: stub-model magic prompt for the schedule
- hideKeyboard
- tapOn: ${output.s.scheduleEveryDay}
- tapOn: ${output.re.scheduleForWhen}
- extendedWaitUntil:
    visible: ".*e2e:echo daily upgrade.*"  # literal-ok: the prompt typed above names the schedule
    timeout: 15000
- runFlow: ../../_sub/back-to-conversations.yaml

# Text Smallest; style Soft with a tweak (sharp corners). Flutter 2.1.4's Appearance is a guided page: settings
# search "Text size" opens its Text size question, a four-step slider (Smallest, Small, Default, Large) dragged to
# the left end; then "Back to all chips" > Style > Soft, and its Shape question > Corners Sharp. Choices save as
# they are made.
- runFlow: ../../_sub/open-settings.yaml
- runFlow:
    file: ../../_sub/settings-search.yaml
    env:
      QUERY: ${output.t.textSizeTitle}
- tapOn:
    text: ${output.s.textSizeTitle + '(\n(?s).*)?'}
    index: 1
- swipe:
    from:
      text: ${'.*, ' + output.s.textSizeTitle}  # literal-ok: the slider reads "<size>, Text size"
    direction: LEFT
- extendedWaitUntil:
    visible: ${output.s.textSizeSmallest + ', ' + output.s.textSizeTitle}
    timeout: 10000
- runFlow:
    when:
      visible: ${output.s.tourNotNow}
    commands:
      - tapOn: ${output.s.tourNotNow}
- tapOn: ${output.s.kitGuideBack}
# The all-chips page lists "Style\nSolid" rows on a first visit and "Style, Soft" chips after one.
- tapOn: ${output.s.appearanceChipStyle + '(\n|, )(?s).*'}
- tapOn: ${output.s.appearanceSurfaceSoft}
- tapOn: ${output.s.appearanceChipShape + ', (?s).*'}
- tapOn: ${output.s.appearanceFineTuneCornersSharp}
- extendedWaitUntil:
    visible: ${output.s.appearanceChipShape + ', ' + output.s.appearanceFineTuneCornersSharp + '(?s).*'}
    timeout: 10000
- runFlow: ../../_sub/back-to-conversations.yaml

# Built-in Linux with a project, its server running. Flutter 2.1.4 downloads from the real pinned hosts (it has no
# download-base hook); about 4 minutes on the emulator. Settings > Server > This phone > Set up OpenCode on this phone,
# then "OpenCode is ready" names the first project. The name field's accessibility node covers the whole column, so
# Maestro cannot focus it: the project keeps 2.1.4's suggested name "my-app" (Part C looks for that name).
- runFlow: ../../_sub/open-settings.yaml
- tapOn: ${output.s.settingsHubServer + '(\n(?s).*)?'}
- tapOn: ${output.s.settingsV3ThisPhone + '(\n(?s).*)?'}
- tapOn: ${output.s.phoneSetupStartSetUp}
- repeat:
    times: 10
    while:
      notVisible: ${output.s.phoneSetupReadyTitle + '(\n(?s).*)?'}
    commands:
      - extendedWaitUntil:
          visible: ${output.s.phoneSetupReadyTitle + '(\n(?s).*)?'}
          timeout: 300000
          optional: true
- tapOn: ${output.s.phoneSetupReadyCreateOpen}
- extendedWaitUntil:
    visible: ${output.s.kitComposerField + '(?s).*'}
    timeout: 120000
- runFlow: ../../_sub/back-to-conversations.yaml
# Setup makes "On this phone" the current server: back to FX-OC2.
- runFlow:
    file: ../../_sub/switch-server.yaml
    env:
      NAME: ${'(?s).*' + output.fx.serverAddress.replace(/\./g, '\\.')}  # literal-ok: built from fixture data

# The voice pack, set up from the composer's mic as E2E-13 does (real download, pinned by hash in the app).
# adb: permission
- runScript:
    file: ../../_hooks/adb.js
    env:
      HOOK: permission
      ARGS: '{"perm": "RECORD_AUDIO", "grant": true}'
- tapOn: "Upgrade pin two(, .*)?"  # literal-ok: title seeded through the fixture above
- tapOn: ${output.s.kitComposerVoice}
# 2.1.4 shows it as a sheet ("Dismiss\nVoice typing"); the High accuracy pack is about 375 MB.
- extendedWaitUntil:
    visible: ${output.c.voiceAutoSetupTitle}
    timeout: 30000
- tapOn: ${output.re.voiceAutoSetupDownload}
# 2.1.4 downloads, verifies (a minute or more on the emulator), then opens voice mode in the composer: wait for its
# "Leave voice mode" and leave it.
- repeat:
    times: 3
    while:
      notVisible: ${output.s.kitVoiceLeave}
    commands:
      - extendedWaitUntil:
          visible: ${output.s.kitVoiceLeave}
          timeout: 300000
          optional: true
- tapOn: ${output.s.kitVoiceLeave}
- runFlow: ../../_sub/back-to-conversations.yaml

# Both Quick Settings tiles (the upgrade gate checks they are still placed afterwards).
# adb: qs-tile
- runScript:
    file: ../../_hooks/adb.js
    env:
      HOOK: qs-tile
      ARGS: '{"action": "add", "component": ".AttentionTileService"}'
# adb: qs-tile
- runScript:
    file: ../../_hooks/adb.js
    env:
      HOOK: qs-tile
      ARGS: '{"action": "add", "component": ".PauseTileService"}'

# The Conversations widget on the launcher home screen. Optional steps: when the launcher differs, Part A goes on and
# the upgrade gate's widget check fails, naming the missing widget.
- runFlow: ../../_sub/place-widget.yaml
- launchApp
# The two pinned conversations above are the app's launcher shortcuts.

# Arabic last.
- runFlow: ../../_sub/open-settings.yaml
- runFlow: ../../_sub/open-language.yaml
- tapOn: ${output.s.e7LocaleUiArabic}
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ${output.s.x_ar_chats_home}
    timeout: 60000

# Dependency updates: the actions used by the workflows. The native Gradle
# dependencies are pinned in native/gradle/libs.versions.toml and moved by hand.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Pushing master must not re-run CI on every open bot PR (each refresh
    # costs CI minutes and emails); refresh one on demand: "@dependabot rebase".
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

# Native device lane (gap 6): Macrobenchmark start-up + frame timing, and the Baseline/Startup Profile generation, on a
# device. Dispatch only: never on push (CI budget rule). The numbers are uploaded as the `native-device-numbers` artifact
# and printed in the job summary.
#
#   target=emulator  GitHub-hosted KVM emulator (API 34, x86_64 google_apis). Numbers are relative, not real-phone numbers.
#   target=testlab   Firebase Test Lab real device (needs the GCP_TESTLAB_KEY secret = a service-account JSON for the free
#                    project; billing stays off, so this uses the free daily quota). Skipped with a notice when the secret
#                    is missing.
#
# Local equivalent: native/tool/qa/device-bench.sh (same tasks, same artifact layout).
name: Native device
run-name: Native device · ${{ github.ref_name }} · ${{ inputs.what }} · ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      what:
        description: "startup: cold-start benchmarks. frames: stream frame timing. profile: regenerate baseline + startup profile. all: all three"
        type: choice
        options: [startup, frames, profile, all]
        default: startup
      target:
        description: "emulator: GitHub-hosted KVM emulator. testlab: Firebase Test Lab (free quota, needs secret). build: only build and upload the two APKs (run them on Test Lab by hand)"
        type: choice
        options: [emulator, testlab, build]
        default: emulator

permissions:
  contents: read

concurrency:
  group: native-device-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_FLAGS: --stacktrace
  RUNNER_TRACKING_ID: ""

defaults:
  run:
    working-directory: native

jobs:
  device:
    name: device (${{ inputs.target }}, ${{ inputs.what }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/native-setup
      - name: Preview signing key (so the benchmark APK carries the preview signer)
        env:
          KEYSTORE_B64: ${{ secrets.NATIVE_PREVIEW_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$RUNNER_TEMP/android-home"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android-home/debug.keystore"
            echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-home" >> "$GITHUB_ENV"
          fi
      - name: Build the benchmark APK and the Macrobenchmark APK
        run: |
          cat > "$RUNNER_TEMP/no-lint-vital.init.gradle" <<'EOT'
          allprojects { tasks.configureEach { if (name.startsWith("lintVital")) enabled = false } }
          EOT
          ./gradlew :androidApp:assemblePreviewBenchmark :benchmark:assembleBenchmark \
            -I "$RUNNER_TEMP/no-lint-vital.init.gradle" $GRADLE_FLAGS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-benchmark-apks
          path: |
            native/androidApp/build/outputs/apk/preview/benchmark/*.apk
            native/benchmark/build/outputs/apk/benchmark/*.apk
          retention-days: 7
          if-no-files-found: error
      - name: Enable KVM
        if: ${{ inputs.target == 'emulator' }}
        working-directory: ${{ github.workspace }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        if: ${{ inputs.target == 'emulator' }}
        uses: reactivecircus/android-emulator-runner@69c8581131285561115a2e413eb0037446bdc2d6 # v2.35.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: native
          script: tool/qa/device-bench.sh "${{ inputs.what }}" "$GITHUB_WORKSPACE/native/build/device-numbers"
      - name: Run on Firebase Test Lab
        if: ${{ inputs.target == 'testlab' }}
        env:
          GCP_KEY: ${{ secrets.GCP_TESTLAB_KEY }}
          WHAT: ${{ inputs.what }}
        run: |
          if [ -z "$GCP_KEY" ]; then
            echo "::notice::GCP_TESTLAB_KEY is not set; Test Lab was skipped. Use target=emulator or run native/tool/qa/testlab-bench.sh locally."
            exit 0
          fi
          printf '%s' "$GCP_KEY" > "$RUNNER_TEMP/gcp.json"
          tool/qa/testlab-bench.sh "$WHAT" "$RUNNER_TEMP/gcp.json" "$GITHUB_WORKSPACE/native/build/device-numbers"
      - name: Summary
        if: always()
        run: |
          mkdir -p build/device-numbers
          { echo "### Native device numbers (${{ inputs.target }}, ${{ inputs.what }})"; echo;
            [ -f build/device-numbers/summary.md ] && cat build/device-numbers/summary.md || echo "no numbers produced"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-device-numbers
          path: native/build/device-numbers
          retention-days: 14
          if-no-files-found: ignore

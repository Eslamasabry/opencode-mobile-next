# Linux desktop build. Packages the tar.gz and .deb with scripts/package-linux.sh
# and, on a release tag, attaches them to the existing GitHub release.
#
# First green GitHub-hosted run was on 2026-09-03; before that the account's
# Actions billing was blocked and the steps had only been run on a developer
# machine.

name: Linux desktop

on:
  pull_request:
  push:
    branches:
      - master
      - dev
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the Shorebird-pinned Flutter used for local builds and
  # releases: `flutter --version` from
  # ~/.shorebird/bin/cache/flutter/91f8bd75.../bin/flutter reports
  # "Flutter 3.47.2 ... Tools • Dart 3.13.1". Shorebird's fork is not
  # installable here, so CI uses upstream stable at the same version.
  FLUTTER_VERSION: "3.47.2"

jobs:
  build:
    name: Analyze, test, build and package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux desktop toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          # clang/cmake/ninja/pkg-config: the Flutter Linux build itself.
          # libgtk-3-dev: the runner and every plugin.
          # libsecret-1-dev: flutter_secure_storage_linux is the only plugin
          #   in this app that needs anything beyond GTK.
          # liblzma-dev: pulled in by the Flutter tool's Linux build.
          # desktop-file-utils: desktop-file-validate, used by the packaging
          #   script to reject a malformed .desktop entry.
          # dpkg-dev: dpkg-shlibdeps, which derives the .deb's Depends from
          #   the ELF objects actually shipped.
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev liblzma-dev \
            desktop-file-utils dpkg-dev

      - name: Install a matching libstdc++ development package
        # Best effort. clang picks the newest GCC tree it can see; if that
        # tree has headers but no libstdc++.so the link fails with
        # `cannot find -lstdc++`. Installing the dev package for the newest
        # available GCC keeps the default toolchain complete, and
        # linux/packaging/gcc-install-dir.sh covers the case where it is not.
        run: |
          set -uo pipefail
          for v in 14 13 12; do
            if sudo apt-get install -y --no-install-recommends "libstdc++-$v-dev"; then
              echo "installed libstdc++-$v-dev"
              break
            fi
          done
          exit 0

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock', 'packages/opencode_sdk/pubspec.lock') }}
          restore-keys: |
            pub-linux-${{ env.FLUTTER_VERSION }}-

      - name: Enable the Linux desktop target
        run: flutter config --enable-linux-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Resolve generated SDK dependencies
        run: dart pub get --directory packages/opencode_sdk --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        # Chunked into thirds so one hung invocation cannot consume the whole
        # job timeout; each chunk keeps the repo's serial --concurrency=1.
        # Same shape as the Android gate, deliberately.
        run: |
          set -euo pipefail
          mapfile -t files < <(ls test/*_test.dart | sort)
          total=${#files[@]}
          test "$total" -gt 0
          third=$(( (total + 2) / 3 ))
          for start in 0 "$third" $((third * 2)); do
            chunk=("${files[@]:start:third}")
            [ ${#chunk[@]} -eq 0 ] && continue
            flutter test --concurrency=1 "${chunk[@]}"
          done

      - name: Build the Linux release bundle
        run: |
          set -euo pipefail
          # Prints nothing when clang links C++ on its own, which is the
          # expected case on a GitHub runner. It only speaks up on hosts whose
          # newest GCC tree is incomplete, and it proves the flag works before
          # recommending it, so this stays correct either way.
          gcc_dir="$(linux/packaging/gcc-install-dir.sh)"
          if [ -n "$gcc_dir" ]; then
            echo "clang needs a toolchain hint: --gcc-install-dir=$gcc_dir"
            export CXXFLAGS="${CXXFLAGS:-} --gcc-install-dir=$gcc_dir"
            export LDFLAGS="${LDFLAGS:-} --gcc-install-dir=$gcc_dir"
          fi
          flutter build linux --release

      - name: Verify the bundle
        run: |
          set -euo pipefail
          bundle=build/linux/x64/release/bundle
          test -x "$bundle/opencode_mobile"
          test -s "$bundle/data/flutter_assets/version.json"
          # Nothing outside the bundle may be needed at runtime beyond system
          # libraries; a missing bundled plugin shows up here as "not found".
          ldd "$bundle/opencode_mobile"
          ! ldd "$bundle/opencode_mobile" | grep -q "not found"

      - name: Package
        # Refuses to run if the bundle's version.json disagrees with
        # pubspec.yaml, and prints SHA-256 for every artifact it writes.
        run: scripts/package-linux.sh

      - name: Record the version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*\([^[:space:]#]*\).*/\1/p' pubspec.yaml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaged $version"

      - name: Upload the Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-linux-x64-${{ steps.version.outputs.version }}
          path: |
            build/linux/packages/*.tar.gz
            build/linux/packages/*.deb
            build/linux/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: opencode-linux-x64-*
          merge-multiple: true
          path: dist

      - name: Attach the artifacts to the release for this tag
        # The tag is the release identity that lib/update/
        # desktop_release_check.dart reads: it parses the +buildNumber out of
        # tag_name (e.g. v1.0.29+30-preview.9 -> 30) and compares it with the
        # running build. Asset names are never parsed, so they only need to
        # be recognisable. Uploading to an existing release rather than
        # creating one keeps scripts/release.sh the single author of releases.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release upload "${GITHUB_REF_NAME}" dist/* \
            --repo "$GITHUB_REPOSITORY" --clobber

# Builds the Android sideload APK on a release tag as a Shorebird release with
# the project's real signing key, proves the signer is the public upgrade
# lineage and the version matches the tag, keeps the APK as a workflow artifact
# for 90 days, and creates or updates a draft stable GitHub release for a tag.
# A maintainer must inspect and publish the draft; this workflow never
# announces it publicly.
#
# Every installable release is a Shorebird release so later Dart-only fixes
# can ship as `scripts/release.sh patch` against the exact released version.
# A plain `flutter build apk` cannot receive patches and is never used here.
# Only a v* tag run uploads the release to Shorebird; any other run (a manual
# dispatch on a branch) builds the same APK with `--dry-run` and uploads
# nothing, and scripts/verify_github_release.py refuses to publish it.
#
# Shorebird accepts each version once: after a successful Shorebird upload the
# same x.y.z+N cannot be released again, so a re-run of a tag whose Shorebird
# step already succeeded fails. Recover from a later failure by bumping the
# build number in pubspec.yaml and tagging the new version.
#
# Fails closed: without the four RELEASE_* secrets and SHOREBIRD_TOKEN the job
# stops before it touches Gradle, so a fork or a missing secret cannot produce
# a misleading "signed" or unpatchable artifact.

name: Android release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Public sideload lineage. Must equal PUBLIC_SIDELOAD_CERT_SHA256 in
  # scripts/release.sh and the fingerprint printed in every release note.
  SIDELOAD_CERT_SHA256: 842284B27AA297FB74CF831779FD16498517E1BC2104451459FEC2EA7AC11D1C
  # Shorebird's Flutter fork the release engine is built from. Must equal
  # SHOREBIRD_FLUTTER_VERSION in scripts/release.sh (checked below) so CI and
  # local sideload releases ship the same engine.
  SHOREBIRD_FLUTTER_VERSION: "3.47.1"

jobs:
  # scripts/verify_github_release.py checks this job's name and the step names
  # in its RELEASE_STEPS and UNPATCHABLE_BUILD_STEPS before publication; rename
  # a step there in the same change.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require the release signing and Shorebird secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_B64" ]  || missing+=(RELEASE_KEYSTORE_BASE64)
          [ -n "$STORE_PASSWORD" ] || missing+=(RELEASE_STORE_PASSWORD)
          [ -n "$KEY_ALIAS" ]     || missing+=(RELEASE_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ]  || missing+=(RELEASE_KEY_PASSWORD)
          [ -n "$SHOREBIRD_TOKEN" ] || missing+=(SHOREBIRD_TOKEN)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Release build blocked: repository secrets not set: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions. See android/key.properties.example."
            if [ -z "$SHOREBIRD_TOKEN" ]; then
              echo "::error::Without SHOREBIRD_TOKEN the APK would not be a Shorebird release and could never receive patches."
              echo "Create it with 'shorebird login:ci' and store it with 'gh secret set SHOREBIRD_TOKEN' (docs/technical-overview.md)."
            fi
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the Shorebird release version
        id: version
        run: |
          set -euo pipefail
          # Same derivation as scripts/release.sh: exactly one x.y.z+N version.
          version="$(sed -n 's/^[[:space:]]*version:[[:space:]]*//p' pubspec.yaml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[1-9][0-9]*$ ]]; then
            echo "::error::pubspec.yaml must contain exactly one version in x.y.z+positive-build-number form. Found: ${version:-<none>}"
            exit 1
          fi
          pinned="$(sed -n 's/^readonly SHOREBIRD_FLUTTER_VERSION="\([^"]*\)"$/\1/p' scripts/release.sh)"
          if [ "$pinned" != "$SHOREBIRD_FLUTTER_VERSION" ]; then
            echo "::error::Workflow Shorebird Flutter $SHOREBIRD_FLUTTER_VERSION differs from scripts/release.sh (${pinned:-<none>})"
            exit 1
          fi
          {
            echo "version=$version"
            echo "build_name=${version%%+*}"
            echo "build_number=${version##*+}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$tag" ]; then
            echo "::error::Tag v$tag does not match pubspec.yaml version $VERSION"
            exit 1
          fi
          # The notes are needed after the Shorebird upload; a missing file
          # must stop the run before a version is spent.
          source_notes="docs/releases/v$VERSION.md"
          if [ ! -s "$source_notes" ] || [ "$(head -n 1 "$source_notes")" != "# OpenCode Mobile $VERSION" ]; then
            echo "::error::$source_notes must exist and start with '# OpenCode Mobile $VERSION'"
            exit 1
          fi
          echo "Building $VERSION"

      - name: Require the exact master candidate and an unpublished tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --quiet origin master
          [ "$(git rev-parse origin/master)" = "$GITHUB_SHA" ] || {
            echo '::error::Release tag must identify the current master candidate'
            exit 1
          }
          if gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/release-state.json"; then
            python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("isDraft") is True else "Refusing to overwrite a published release")' "$RUNNER_TEMP/release-state.json"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      # Shorebird brings its own Flutter fork (SHOREBIRD_FLUTTER_VERSION); no
      # upstream Flutter is installed in this job, so nothing else can build
      # the APK.
      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@4dd9d7dc2d7930bfeadb053b6e94b5110779d1e5 # v1.0.1

      - name: Show the Shorebird toolchain
        run: shorebird --version

      # android/settings.gradle.kts needs a Flutter SDK, which only exists
      # once Shorebird builds, so the wrapper is generated in an empty project
      # and copied in: the same files `gradle -p android wrapper` writes.
      - name: Generate ignored Gradle wrapper
        run: |
          set -euo pipefail
          wrapper_project="$RUNNER_TEMP/gradle-wrapper"
          mkdir -p "$wrapper_project"
          : > "$wrapper_project/settings.gradle.kts"
          gradle -p "$wrapper_project" wrapper \
            --gradle-version 9.5.0 \
            --distribution-type all \
            --gradle-distribution-sha256-sum a3c4ba4aca8f0075688b9c5b18939fd28e8cb4357c227da5c1d9f38343791439
          cp "$wrapper_project/gradlew" "$wrapper_project/gradlew.bat" android/
          cp "$wrapper_project/gradle/wrapper/gradle-wrapper.jar" \
            "$wrapper_project/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/

      - name: Install the release signing identity
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEYSTORE: ${{ runner.temp }}/opencode-release.jks
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          # Refuse before building if the keystore is not the public lineage.
          actual="$(OC_STORE_PASSWORD="$STORE_PASSWORD" keytool -J-Duser.language=en -list -v \
              -keystore "$KEYSTORE" -alias "$KEY_ALIAS" -storepass:env OC_STORE_PASSWORD |
            sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual" != "$SIDELOAD_CERT_SHA256" ]; then
            echo "::error::Keystore certificate $actual is not the public sideload lineage"
            exit 1
          fi
          printf '%s\n' \
            "storeFile=$KEYSTORE" \
            "storePassword=$STORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" \
            > android/key.properties

      - name: Read previous published release APK size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          baseline="$(git describe --tags --match 'v*' --abbrev=0 HEAD^)"
          echo "APK_BASELINE_TAG=$baseline" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$baseline" > "$RUNNER_TEMP/apk-baseline.json"

      # Uploads the release to Shorebird so the exact version can be patched.
      # Shorebird accepts each version once; see the header before re-running.
      # Arguments mirror the sideload lane of scripts/release.sh.
      - name: Build and upload Shorebird release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          rm -f build/app/outputs/flutter-apk/app-release.apk
          shorebird release android \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER" \
            --flutter-version "$SHOREBIRD_FLUTTER_VERSION" \
            --artifact apk \
            --dry-run
          python3 tool/release/check_apk_size.py \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --baseline-release-json "$RUNNER_TEMP/apk-baseline.json" \
            --baseline-tag "$APK_BASELINE_TAG" --max-growth-mib 5 \
            --output build/release-metrics/apk-size.json
          shorebird release android \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER" \
            --flutter-version "$SHOREBIRD_FLUTTER_VERSION" \
            --artifact apk

          python3 tool/release/check_apk_size.py \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --baseline-release-json "$RUNNER_TEMP/apk-baseline.json" \
            --baseline-tag "$APK_BASELINE_TAG" --max-growth-mib 5 \
            --output build/release-metrics/apk-size.json

      # A manual run off a tag proves the same build without spending the
      # version on Shorebird. Its APK is not patchable and is never published.
      - name: Build Shorebird dry-run APK (nothing uploaded)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          rm -f build/app/outputs/flutter-apk/app-release.apk
          shorebird release android \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER" \
            --flutter-version "$SHOREBIRD_FLUTTER_VERSION" \
            --artifact apk \
            --dry-run

      - name: Remove the signing identity
        if: always()
        run: rm -f android/key.properties "${{ runner.temp }}/opencode-release.jks"

      - name: Verify APK signer and version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The APK `shorebird release android --artifact apk` writes; the
          # build step deleted any older file before building.
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          certificate_output="$("$tools/apksigner" verify --print-certs "$apk")" || {
            echo '::error::apksigner could not verify the APK'
            exit 1
          }
          printf '%s\n' "$certificate_output"
          mapfile -t signers < <(printf '%s\n' "$certificate_output" |
            sed -En 's/^(Signer #[0-9]+|V[0-9]+ Signer:)[[:space:]]+certificate SHA-256 digest:[[:space:]]*//p' |
            tr '[:lower:]' '[:upper:]' | sort -u)
          [ "${#signers[@]}" = 1 ] || { echo "::error::APK has ${#signers[@]} signers, expected 1"; exit 1; }
          [ "${signers[0]}" = "$SIDELOAD_CERT_SHA256" ] || { echo "::error::APK signer ${signers[0]} is not the sideload lineage"; exit 1; }
          badging="$("$tools/aapt" dump badging "$apk" | sed -n '1p')"
          version="$VERSION"
          name="${version%%+*}"; code="${version#*+}"
          grep -q "^package: name='io.github.eslamasabry.opencode_mobile' " <<<"$badging" || { echo "::error::Package ID mismatch: $badging"; exit 1; }
          grep -q "versionCode='$code'" <<<"$badging" || { echo "::error::versionCode mismatch: $badging"; exit 1; }
          grep -q "versionName='$name'" <<<"$badging" || { echo "::error::versionName mismatch: $badging"; exit 1; }
          mkdir -p dist
          cp "$apk" "dist/opencode-mobile-$version.apk"
          (cd dist && sha256sum "opencode-mobile-$version.apk" > SHA256SUMS)
          {
            echo "## opencode-mobile-$version.apk"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Signer SHA-256: \`$SIDELOAD_CERT_SHA256\`"
            echo
            echo "Shorebird release $version, Flutter $SHOREBIRD_FLUTTER_VERSION (Shorebird engine)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record optional cold-start receipt
        if: ${{ always() }}
        continue-on-error: true
        env:
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          receipt="docs/releases/v${BUILD_NAME}+${BUILD_NUMBER}-cold-start.json"
          if [ -f "$receipt" ]; then
            if mkdir -p build/release-metrics && cp "$receipt" build/release-metrics/cold-start.json; then
              echo 'Cold-start receipt recorded for review.'
            else
              echo '::warning::Could not copy the optional cold-start receipt; release continues.'
            fi
            if ! python3 tool/release/verify_cold_start.py \
              --apk build/app/outputs/flutter-apk/app-release.apk \
              --receipt "$receipt"; then
              echo '::warning::Optional cold-start receipt verification failed; release continues.'
            fi
          else
            echo '::warning::No cold-start receipt for this version; release continues without startup measurements.'
          fi

      - name: Upload optional cold-start receipt
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-cold-start-${{ github.sha }}
          path: build/release-metrics/cold-start.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload APK size measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apk-size-${{ github.sha }}
          path: build/release-metrics/apk-size.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Prepare stable release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          source_notes="docs/releases/v$version.md"
          test -s "$source_notes"
          [ "$(head -n 1 "$source_notes")" = "# OpenCode Mobile $version" ]
          cp "$source_notes" dist/RELEASE_NOTES.md
          {
            echo
            echo '## Verify this build'
            echo
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Build: Shorebird release $version, Flutter $SHOREBIRD_FLUTTER_VERSION (Shorebird engine)"
            echo '- Package ID: `io.github.eslamasabry.opencode_mobile`'
            echo "- Signer SHA-256: \`$SIDELOAD_CERT_SHA256\`"
            echo '- APK SHA-256:'
            echo '```text'
            cat dist/SHA256SUMS
            echo '```'
          } >> dist/RELEASE_NOTES.md

      - name: Upload signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-mobile-signed-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Create draft stable GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/release-state.json"; then
            python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("isDraft") is True else "Refusing to overwrite a published release")' "$RUNNER_TEMP/release-state.json"
            gh release edit "$GITHUB_REF_NAME" \
              --draft --prerelease=false \
              --title "OpenCode Mobile $version" \
              --notes-file dist/RELEASE_NOTES.md
            gh release upload "$GITHUB_REF_NAME" \
              "dist/opencode-mobile-$version.apk" dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --draft --prerelease=false \
              --title "OpenCode Mobile $version" \
              --notes-file dist/RELEASE_NOTES.md \
              "dist/opencode-mobile-$version.apk" dist/SHA256SUMS
          fi

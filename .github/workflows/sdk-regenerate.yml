# Proves packages/opencode_sdk is exactly what tool/sdk/generate.sh produces
# from the checked-in contract. android-quality.yml verifies the manifest and
# matrices against the tree; this job regenerates the tree and fails on drift.
#
# It runs only when the inputs to generation change, and on demand. Manual runs
# are the way to regenerate on a machine without Java: run it on a branch,
# download the "sdk-regeneration-diff" artifact, apply the patch.

name: SDK regeneration

on:
  pull_request:
    paths:
      - contracts/**
      - tool/sdk/**
      - packages/opencode_sdk/**
      - .github/workflows/sdk-regenerate.yml
  push:
    branches:
      - master
      - dev
    paths:
      - contracts/**
      - tool/sdk/**
      - packages/opencode_sdk/**
      - .github/workflows/sdk-regenerate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-regenerate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.sdk-cache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Cache the verified generator JAR
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sdk-cache/openapi-generator-cli-*.jar
          key: openapi-generator-${{ hashFiles('tool/sdk/generate.sh') }}

      - name: Resolve dependencies
        run: |
          flutter pub get
          dart pub get --directory packages/opencode_sdk --enforce-lockfile

      - name: Regenerate the SDK
        run: tool/sdk/generate.sh

      - name: Fail on drift
        id: drift
        run: |
          set -euo pipefail
          git add -A packages/opencode_sdk contracts
          if git diff --cached --quiet; then
            echo "packages/opencode_sdk matches the generator output."
            exit 0
          fi
          echo "::error::Generated SDK differs from the committed tree. Download the sdk-regeneration-diff artifact and apply it."
          git diff --cached --stat
          mkdir -p "$RUNNER_TEMP/drift"
          git diff --cached --binary > "$RUNNER_TEMP/drift/sdk-regeneration.patch"
          echo "patch=$RUNNER_TEMP/drift/sdk-regeneration.patch" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Upload the drift patch
        if: failure() && steps.drift.outputs.patch != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-regeneration-diff
          path: ${{ steps.drift.outputs.patch }}
          retention-days: 14

# The uploaded APK is signed with an isolated CI key. It proves the release
# build compiles, but it is not an upgrade-compatible distribution artifact.

name: Android quality gate

on:
  pull_request:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate ignored Gradle wrapper
        run: >-
          gradle -p android wrapper
          --gradle-version 9.5.0
          --distribution-type all
          --gradle-distribution-sha256-sum a3c4ba4aca8f0075688b9c5b18939fd28e8cb4357c227da5c1d9f38343791439

      - name: Resolve generated SDK dependencies
        run: dart pub get --directory packages/opencode_sdk --enforce-lockfile

      - name: Verify generated OpenCode SDK integrity
        run: |
          dart run tool/sdk/verify_contract.dart \
            contracts/opencode-openapi-03bba464.json \
            contracts/opencode-sdk-manifest.json before
          dart run tool/sdk/verify_generated.dart \
            packages/opencode_sdk \
            contracts/opencode-sdk-manifest.json
          dart run tool/sdk/verify_contract_matrix.dart \
            contracts/opencode-openapi-03bba464.json \
            contracts/opencode-sdk-manifest.json \
            packages/opencode_sdk \
            contracts/opencode-sdk-matrix.json \
            contracts/opencode-sdk-matrix.md
          dart run tool/sdk/verify_artifacts_independent.dart \
            contracts/opencode-openapi-03bba464.json \
            contracts/opencode-sdk-manifest.json \
            packages/opencode_sdk \
            contracts/opencode-sdk-matrix.json \
            contracts/opencode-sdk-matrix.md

      - name: Test generated OpenCode SDK
        working-directory: packages/opencode_sdk
        run: dart test

      - name: Analyze generated OpenCode SDK
        working-directory: packages/opencode_sdk
        run: dart analyze

      - name: Analyze
        run: flutter analyze

      - name: Test
        # Chunked into thirds so one hung invocation cannot consume the whole
        # job timeout; each chunk keeps the repo's serial --concurrency=1.
        run: |
          set -euo pipefail
          mapfile -t files < <(ls test/*_test.dart | sort)
          total=${#files[@]}
          test "$total" -gt 0
          third=$(( (total + 2) / 3 ))
          for start in 0 "$third" $((third * 2)); do
            chunk=("${files[@]:start:third}")
            [ ${#chunk[@]} -eq 0 ] && continue
            flutter test --concurrency=1 "${chunk[@]}"
          done

      - name: Create isolated CI signing identity
        env:
          CI_KEYSTORE: ${{ runner.temp }}/opencode-ci-release.jks
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$CI_KEYSTORE" \
            -storepass ci-not-for-distribution \
            -keypass ci-not-for-distribution \
            -alias ci-release \
            -keyalg RSA \
            -keysize 3072 \
            -validity 1 \
            -dname "CN=CI Build, O=OpenCode Mobile"
          chmod 600 "$CI_KEYSTORE"
          printf '%s\n' \
            "storeFile=$CI_KEYSTORE" \
            'storePassword=ci-not-for-distribution' \
            'keyAlias=ci-release' \
            'keyPassword=ci-not-for-distribution' \
            > android/key.properties
          chmod 600 android/key.properties

      - name: Run Android release lint
        run: ./android/gradlew -p android :app:lintRelease --no-daemon

      - name: Compile test-signed release APK
        run: flutter build apk --release

      - name: Verify release artifact exists
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload test-signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-mobile-ci-test-signed-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

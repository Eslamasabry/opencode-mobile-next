# The gate runs as parallel jobs in one workflow run: `checks` (SDK, analyze,
# runner unit tests, Android lint), `test` (the whole recursive suite split into
# timing-balanced shards by tool/qa/run_serial_tests.py; together the shards run
# every test file exactly once), `build` (the test-signed release APK) and a
# final `gate` that succeeds only when all of them did. Release preflight
# (scripts/verify_github_release.py) checks those jobs and step names.
#
# Branch APKs use one stable, non-production CI certificate so they can update
# one another. Fork pull requests cannot access secrets and use an isolated
# key instead. Neither certificate is the production release identity.

name: Android quality gate
run-name: ${{ inputs.apk_only && 'Android APK only' || 'Android quality gate' }} · ${{ github.ref_name }}

on:
  pull_request:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      apk_only:
        description: Build a signed checkpoint APK without running verification gates
        type: boolean
        default: false
      native_pdf_proof:
        description: Build an additional synthetic local-PDF proof APK for an isolated QA device
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    if: ${{ !inputs.apk_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
          # Branch runs on dev and master refresh the dependency cache too.
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/dev' }}

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Set up Node for the optional quota collector tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"

      - name: Test optional quota collector with synthetic inputs
        run: node --test tool/quota/collector.test.mjs

      - name: Generate ignored Gradle wrapper
        run: >-
          gradle -p android wrapper
          --gradle-version 9.5.0
          --distribution-type all
          --gradle-distribution-sha256-sum a3c4ba4aca8f0075688b9c5b18939fd28e8cb4357c227da5c1d9f38343791439

      - name: Resolve generated SDK dependencies
        run: dart pub get --directory packages/opencode_sdk --enforce-lockfile

      - name: Verify generated OpenCode SDK integrity
        run: |
          dart run tool/sdk/verify_contract.dart \
            contracts/opencode-openapi-f12e14cf.json \
            contracts/opencode-sdk-manifest.json before
          dart run tool/sdk/verify_generated.dart \
            packages/opencode_sdk \
            contracts/opencode-sdk-manifest.json
          dart run tool/sdk/verify_contract_matrix.dart \
            contracts/opencode-openapi-f12e14cf.json \
            contracts/opencode-sdk-manifest.json \
            packages/opencode_sdk \
            contracts/opencode-sdk-matrix.json \
            contracts/opencode-sdk-matrix.md
          dart run tool/sdk/verify_artifacts_independent.dart \
            contracts/opencode-openapi-f12e14cf.json \
            contracts/opencode-sdk-manifest.json \
            packages/opencode_sdk \
            contracts/opencode-sdk-matrix.json \
            contracts/opencode-sdk-matrix.md

      - name: Test generated OpenCode SDK
        working-directory: packages/opencode_sdk
        run: dart test

      - name: Analyze generated OpenCode SDK
        working-directory: packages/opencode_sdk
        run: dart analyze

      - name: Analyze
        run: flutter analyze

      - name: Check the serial test runner
        run: python3 -m unittest discover -s tool/qa -p 'test_*.py'

      - name: Run Android release lint
        run: ./android/gradlew -p android :app:lintRelease --no-daemon

  test:
    # The shard count is the matrix length, so the name, the runner and the
    # release preflight can never disagree about how many shards make a run.
    name: test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    if: ${{ !inputs.apk_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Native harness tests compile Kotlin and run it on the JVM.
      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # The setup-runner native harness needs org.json, which a shard has no
      # Gradle cache to find; fetch the same jar Gradle resolves, pinned.
      - name: Fetch org.json for the native harness
        run: |
          jar="$RUNNER_TEMP/json-20180813.jar"
          curl -sSfL -o "$jar" https://repo1.maven.org/maven2/org/json/json/20180813/json-20180813.jar
          echo "518080049ba83181914419d11a25d9bc9833a2d729b6a6e7469fa52851356da8  $jar" | sha256sum -c -
          echo "JSON_JAR=$jar" >> "$GITHUB_ENV"

      - name: Test
        # Same runner as the local gate (tool/qa/run_serial_tests.py): every
        # test/**/*_test.dart is discovered recursively, nested suites such as
        # the theme goldens included, and split into timing-balanced shards
        # (tool/qa/test_timings.json); every file runs in exactly one shard.
        # A shard runs as one bounded chunk, four files at a time on the
        # runner's four vCPUs. A hung chunk is stopped at the deadline and
        # named in summary.json with its failing files instead of silently
        # consuming the job timeout. Logs and JSON reports land in
        # build/traycer for the artifact below.
        run: >-
          python3 tool/qa/run_serial_tests.py
          --flutter "$(command -v flutter)"
          --shard-index ${{ matrix.shard }}
          --shard-count ${{ strategy.job-total }}
          --concurrency 4
          --chunk-size 1000
          --chunk-timeout 900
          --json-report
          --output-root build/traycer

      - name: Upload serial test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serial-test-logs-${{ github.sha }}-shard-${{ matrix.shard }}
          path: build/traycer
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
          # Branch runs on dev and master refresh the dependency cache too.
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/dev' }}

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate ignored Gradle wrapper
        run: >-
          gradle -p android wrapper
          --gradle-version 9.5.0
          --distribution-type all
          --gradle-distribution-sha256-sum a3c4ba4aca8f0075688b9c5b18939fd28e8cb4357c227da5c1d9f38343791439

      - name: Configure CI signing identity
        env:
          CI_KEYSTORE: ${{ runner.temp }}/opencode-ci-release.jks
          CI_KEYSTORE_BASE64: ${{ secrets.CI_KEYSTORE_BASE64 }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$CI_KEYSTORE_BASE64" && -n "$CI_KEYSTORE_PASSWORD" ]]; then
            printf '%s' "$CI_KEYSTORE_BASE64" | base64 --decode > "$CI_KEYSTORE"
            actual=$(keytool -list -v \
              -keystore "$CI_KEYSTORE" \
              -alias ci-release \
              -storepass "$CI_KEYSTORE_PASSWORD" |
              sed -n 's/.*SHA256: //p' | tr -d ':[:space:]')
            expected=2D010C2103CB2F78ABAACA690EAD4D45F8003A6C0A02082CD2A2AE62FD18D0EC
            test "$actual" = "$expected"
          elif [[ "${{ github.event_name }}" == pull_request ]]; then
            CI_KEYSTORE_PASSWORD=ci-not-for-distribution
            keytool -genkeypair -noprompt \
              -keystore "$CI_KEYSTORE" \
              -storepass "$CI_KEYSTORE_PASSWORD" \
              -keypass "$CI_KEYSTORE_PASSWORD" \
              -alias ci-release \
              -keyalg RSA \
              -keysize 3072 \
              -validity 1 \
              -dname "CN=CI Pull Request Build, O=OpenCode Mobile"
          else
            echo 'Stable CI signing secrets are missing' >&2
            exit 1
          fi
          chmod 600 "$CI_KEYSTORE"
          printf '%s\n' \
            "storeFile=$CI_KEYSTORE" \
            "storePassword=$CI_KEYSTORE_PASSWORD" \
            'keyAlias=ci-release' \
            "keyPassword=$CI_KEYSTORE_PASSWORD" \
            > android/key.properties
          chmod 600 android/key.properties

      - name: Compile test-signed release APK
        run: flutter build apk --release

      - name: Verify release artifact exists
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload test-signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-mobile-ci-test-signed-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      # Keep the product APK above separate from this synthetic test target.
      # Both use the checked stable CI signer; only an explicit manual run can
      # produce the proof APK, and it is never the product delivery artifact.
      - name: Compile isolated native PDF proof APK
        if: github.event_name == 'workflow_dispatch' && inputs.native_pdf_proof
        run: flutter build apk --release --target tool/native_pdf_proof.dart

      - name: Upload native PDF proof APK
        if: github.event_name == 'workflow_dispatch' && inputs.native_pdf_proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-mobile-native-pdf-proof-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  gate:
    # The one required result: every quality job passed. An APK-only manual
    # run passes here with checks and tests skipped, and release preflight
    # rejects it for exactly that reason.
    name: gate
    if: ${{ !cancelled() }}
    needs: [checks, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality job
        env:
          APK_ONLY: ${{ inputs.apk_only && 'true' || 'false' }}
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "checks=$CHECKS test=$TESTS build=$BUILD apk_only=$APK_ONLY"
          test "$BUILD" = success
          if [[ "$APK_ONLY" == true ]]; then
            test "$CHECKS" = skipped
            test "$TESTS" = skipped
          else
            test "$CHECKS" = success
            test "$TESTS" = success
          fi

# CI for the native Kotlin/Compose app under native/: compile, desktop tests (sharded) and an APK (the benchmark
# build type, preview-signed, no other secrets). Commits carry [skip ci], so the usual path is workflow_dispatch or a
# push to native/screens-merge* / native/ci-* branches. Phone APKs stay signed locally.
#
# Lanes (native/tool/ci/LANES.md):
#   fast    default for a manual dispatch. Compile + desktop tests of the modules changed against `base` (and their
#           all dependents, transitively; everything if too much changed) without picture tests + the APK, all in parallel.
#   full    every module, picture tests included, compared with the CI-recorded goldens. Push runs use this.
#   candidate all module tests with pictures, quality/security, Android host/unit and release self-tests; no APK/signing.
#   goldens re-records the desktop goldens on the runner and uploads them as the `ci-goldens` artifact.
# `tasks` (custom Gradle tasks) and `apk_only` work as before and ignore the lane.
name: Native CI
run-name: Native CI · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "fast: changed modules, no picture tests (default). full: all modules + goldens. candidate: complete release checks. goldens: re-record the goldens"
        type: choice
        options: [fast, full, candidate, goldens]
        default: fast
      base:
        description: Branch the fast lane diffs against to pick the changed modules
        type: string
        default: native/screens-merge41
      tasks:
        description: Optional Gradle tasks (e.g. ":ui:kit:desktopTest"); when set, only these run instead of the shards
        type: string
        default: ""
      apk:
        description: "Upload the preview APK as an artifact (about 100 MB; default off to save GitHub egress and storage). For someone without a build machine; owner and interim builds come from the build server. master, tags and apk_only always upload."
        type: boolean
        default: false
      apk_only:
        description: Build only the preview APK (signed with the preview key), skip compile and test shards
        type: boolean
        default: false
      references:
        description: "Custom-tasks runs only: required = run the tests as a lane that fetches its pictures does (OC_REFERENCES=required), so a missing picture fails instead of skipping"
        type: string
        default: ""
      android_unit:
        description: "Run the Android library unit tests (native/android/*) and the :androidApp unit tests with the fast and full lanes; they count in the verdict. Untick for a quicker run that skips them"
        type: boolean
        default: true
      runner:
        description: "self: the always-warm oc-native runner (falls back to GitHub-hosted when it is offline). github: force GitHub-hosted runners"
        type: choice
        options: [self, github]
        default: self
  push:
    branches:
      - "native/screens-merge*"
      - "native/ci-*"

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}-${{ inputs.lane || 'push' }}-${{ inputs.tasks != '' }}-${{ inputs.apk_only == true }}
  # native/next runs queue (the batcher is the only dispatcher); every other branch still cancels its older run
  cancel-in-progress: ${{ github.ref != 'refs/heads/native/next' }}

env:
  # Runners have 4 CPUs and 16 GB. Gradle daemon 6g + Kotlin in-process (gradle.properties) + test forks.
  GRADLE_FLAGS: --continue --stacktrace
  OC_GOLDEN_HOST: "0"
  # The self-hosted runner kills every process that carries its tracking id when a job ends, which would stop the warm
  # Gradle daemon. An empty id keeps the daemon alive between jobs.
  RUNNER_TRACKING_ID: ""

defaults:
  run:
    working-directory: native

jobs:
  where:
    # Chooses the runners for every other job. Self-hosted (the always-warm oc-native machine, native/tool/ci/LANES.md) is
    # used ONLY for native/next, native/screens-merge* and master, for workflow_dispatch and push events on this repository, and only when it is online and `runner` is not
    # `github`. Everything else, and every offline moment, runs on GitHub-hosted ubuntu-latest.
    name: runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: .
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
    steps:
      - name: Pick the runner
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          CHOICE: ${{ inputs.runner || 'self' }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN || github.token }}
        run: |
          hosted='["ubuntu-latest"]'; self='["self-hosted","linux","x64","oc-native"]'; runs_on="$hosted"; why=""
          if [ "$EVENT" != workflow_dispatch ] && [ "$EVENT" != push ]; then why="event $EVENT is never allowed on the self-hosted runner"
          elif [ "$REPO" != Eslamasabry/opencode-mobile-next ]; then why="not the main repository"
          elif [ "$REF" != native/next ] && [ "${REF#native/screens-merge}" = "$REF" ] && [ "$REF" != master ]; then why="branch $REF is not native/next, native/screens-merge* or master"
          elif [ "$CHOICE" = github ]; then why="runner=github requested"
          else
            # Listing runners needs repository administration read, which only RUNNER_STATUS_TOKEN has; the workflow token
            # gets a 403 and then we trust the runner (the dispatcher checks it locally with tool/ci/dispatch.sh).
            if json="$(gh api "repos/$REPO/actions/runners" --jq '[.runners[] | select(.status=="online" and ([.labels[].name] | index("oc-native")))] | length' 2>/dev/null)"; then
              if [ "$json" -ge 1 ]; then runs_on="$self"; why="$json oc-native runner(s) online"
              else why="no oc-native runner online"; fi
            else runs_on="$self"; why="runner status not readable with this token; assuming online"; fi
          fi
          echo "runs_on=$runs_on" >> "$GITHUB_OUTPUT"
          echo "### Runner: \`$runs_on\` ($why)" >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: plan
    needs: where
    if: ${{ inputs.tasks == '' && !inputs.apk_only && inputs.lane != 'goldens' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lane: ${{ steps.p.outputs.lane }}
      shards: ${{ steps.p.outputs.shards }}
      count: ${{ steps.p.outputs.count }}
      mode: ${{ steps.p.outputs.mode }}
      tasks: ${{ steps.p.outputs.tasks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: "Gate self-test (planted logs: a test-compile or drift failure must be FAIL)"
        run: |
          set -o pipefail
          python3 -I tool/ci/test_gate.py 2>&1 | tee "$RUNNER_TEMP/ci-self.log"
      - name: Release gate self-test (the release script refuses without a CI verdict and a device smoke)
        run: |
          set -o pipefail
          python3 -I tool/ci/test_release_gate.py 2>&1 | tee "$RUNNER_TEMP/release-self.log"
      - name: Release tools self-test (identity gate, release script, version names; no Gradle)
        working-directory: .
        run: |
          set -o pipefail
          bash native/tool/release/test/run_tests.sh 2>&1 | tee "$RUNNER_TEMP/release-tools.log"
      - name: detekt ratchet self-test (a new finding fails, an old one does not, also in a moved or renamed file)
        working-directory: .
        run: |
          set -o pipefail
          bash native/tool/test/run_tests.sh B-BUILD-024 2>&1 | tee "$RUNNER_TEMP/detekt-ratchet.log"
      - name: CI egress self-tests (verdict from logs when downloads are refused, a too-old base is refused)
        working-directory: .
        run: |
          set -o pipefail
          bash native/tool/test/run_tests.sh B-CI-30 2>&1 | tee "$RUNNER_TEMP/ci-egress.log"
      - name: Fast-lane module selection self-tests (a changed module reaches every dependent, transitively)
        working-directory: .
        run: |
          set -o pipefail
          bash native/tool/test/run_tests.sh B-CI-313 2>&1 | tee "$RUNNER_TEMP/fast-selection.log"
      - name: Refuse a quick-lane base that is far older than where this branch left the line
        if: ${{ inputs.lane == 'fast' }}
        working-directory: .
        env:
          BASE: ${{ inputs.base || 'native/screens-merge41' }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/native/glass-next:refs/remotes/origin/native/glass-next || true
          if printf '%s' "$BASE" | grep -Eq '^[0-9a-f]{7,40}$'; then ref="$BASE"; else
            ref="origin/$BASE"; git rev-parse --verify -q "$ref^{commit}" >/dev/null || git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" || true
          fi
          bash native/tool/ci/base_check.sh "$ref" origin/native/glass-next "$BRANCH" || [ $? = 2 ]
      - name: Pick the lane and the modules
        id: p
        env:
          LANE: ${{ inputs.lane || 'full' }}
          BASE: ${{ inputs.base || 'native/screens-merge41' }}
        run: |
          out=ALL
          if [ "$LANE" = fast ]; then
            # base is a branch name, or a commit sha (the native/next batcher passes the last green sha)
            if printf '%s' "$BASE" | grep -Eq '^[0-9a-f]{7,40}$'; then ref="$BASE"; else
              ref="origin/$BASE"
              if ! git rev-parse --verify -q "$ref^{commit}" >/dev/null; then
                git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" || true
              fi
            fi
            out="$(tool/ci/fast_tasks.sh "$ref" 2> "$RUNNER_TEMP/why.txt")" || out=ALL
            cat "$RUNNER_TEMP/why.txt"
            # an empty selection (nothing under native/ changed) runs only the quality shard
          fi
          # 8 module-test shards by default; the fast lane always adds the last shard, :quality:test + :quality:secTest together (Konsist, the
          # slowest single task), whether the module list is a selection or ALL. Before, it ran only when fast_tasks.sh
          # happened to list :quality:test, and never when the plan fell back to ALL (the shard picker drops :quality:test
          # from the rotation), so a green fast run could mean the gates never ran. Details: tool/ci/plan_shards.sh.
          eval "$(tool/ci/plan_shards.sh "$LANE" "$out" | sed -E 's/^([a-z]+)=(.*)$/\1=\"\2\"/')"
          shards="$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$total")"
          { echo "lane=$LANE"; echo "mode=$mode"; echo "count=$count"; echo "shards=$shards"; echo "tasks=$tasks"; } >> "$GITHUB_OUTPUT"
          {
            echo "### Plan: lane \`$LANE\`, base \`$BASE\`"
            echo; echo "- test selection: $mode, $count shard(s)"
            if [ "$mode" = list ]; then echo "- tasks:"; printf '%s\n' $tasks | sed 's/^/  - `/; s/$/`/'; fi
            echo; echo '```'; cat "$RUNNER_TEMP/why.txt" 2>/dev/null || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Candidate detekt hook (tool/ci/detekt_lane.sh --all)
        if: ${{ inputs.lane == 'candidate' }}
        run: |
          if [ -f tool/ci/detekt_lane.sh ]; then
            echo "candidate detekt hook: tool/ci/detekt_lane.sh present (detekt job runs --all)"
          else
            echo "candidate detekt hook: waiting for tool/ci/detekt_lane.sh <base-ref> --all from native/detekt-line"
          fi
      - name: Candidate plan and self-test evidence
        if: ${{ always() && inputs.lane == 'candidate' }}
        run: python3 -I tool/ci/candidate_plan.py candidate reports "$RUNNER_TEMP/ci-self.log" "$RUNNER_TEMP/release-self.log" "$RUNNER_TEMP/release-tools.log"
      - name: Verdict inputs in the log (read back when GitHub refuses artifact downloads)
        if: ${{ always() && inputs.lane == 'candidate' }}
        run: bash tool/ci/verdict_log.sh reports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && inputs.lane == 'candidate' }}
        with:
          name: report-candidate-plan
          path: native/reports/candidate-plan.json
          retention-days: ${{ (github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/') || inputs.lane == 'candidate') && 14 || 3 }}
          if-no-files-found: error

  compile:
    name: compile
    needs: [where, plan]
    if: ${{ needs.plan.result == 'success' }}
    # On work branches this job never fails by itself (every shard still reports); the summary job's verdict reds the run.
    continue-on-error: ${{ github.ref_name != 'native/next' && !startsWith(github.ref_name, 'native/screens-merge') && github.ref_name != 'master' }}
    runs-on: ${{ fromJSON(needs.where.outputs.runs_on) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Self-hosted keeps the build/ trees and the vendored AAR between runs (the warm start); hosted starts clean anyway.
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/native-setup
      - name: Stop this workspace's Gradle daemon when the run is cancelled
        if: ${{ cancelled() && runner.environment == 'self-hosted' }}
        working-directory: ${{ github.workspace }}
        run: |
          for p in $(pgrep -f GradleDaemon || true); do
            if ls -l "/proc/$p/fd" 2>/dev/null | grep -q "$GITHUB_WORKSPACE/native/"; then kill -9 "$p" 2>/dev/null || true; fi
          done
      - name: Compile the app (previewBenchmark), and every module's tests on the full lane
        env:
          LANE: ${{ needs.plan.outputs.lane }}
        run: |
          set -o pipefail
          extra=""; [[ "$LANE" = full || "$LANE" = candidate ]] && extra="compileAllTests"
          tool/ci/gradle_retry.sh "$RUNNER_TEMP/compile.log" :androidApp:compilePreviewBenchmarkKotlin $extra $GRADLE_FLAGS
      - name: Compile report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 -I - <<'PY'
          import json, os, re
          log = open(os.environ['RUNNER_TEMP'] + '/compile.log', errors='replace').read().splitlines() if os.path.exists(os.environ['RUNNER_TEMP'] + '/compile.log') else []
          errs = [l.split('/native/', 1)[-1] for l in log if l.startswith('e: ') or 'FAILURE: Build failed' in l or 'Execution failed for task' in l]
          os.makedirs('reports', exist_ok=True)
          ran = any(l.startswith('> Task :') or l.startswith('BUILD ') for l in log)
          all_tests = any(re.search(r'(^|\s)> Task :compileAllTests(\s|$)', l) for l in log)
          json.dump({'errors': sum(1 for l in log if l.startswith('e: ')), 'first_errors': errs[:15], 'failed': os.environ.get('JOB_STATUS') == 'failure', 'gradle_ran': ran, 'compile_all_tests': all_tests}, open('reports/compile.json', 'w'))
          PY
      - name: Verdict inputs in the log (read back when GitHub refuses artifact downloads)
        if: always()
        run: bash tool/ci/verdict_log.sh reports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-compile
          path: native/reports/compile.json
          retention-days: ${{ (github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/') || inputs.lane == 'candidate') && 7 || 3 }}
          if-no-files-found: ignore

  test:
    name: desktop tests ${{ matrix.shard }}
    needs: [where, plan]
    if: ${{ needs.plan.result == 'success' }}
    # On work branches this job never fails by itself (every shard still reports); the summary job's verdict reds the run.
    continue-on-error: ${{ github.ref_name != 'native/next' && !startsWith(github.ref_name, 'native/screens-merge') && github.ref_name != 'master' }}
    runs-on: ${{ fromJSON(needs.where.outputs.runs_on) }}
    timeout-minutes: ${{ needs.plan.outputs.lane == 'candidate' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      LANE: ${{ needs.plan.outputs.lane }}
      MODE: ${{ needs.plan.outputs.mode }}
      COUNT: ${{ needs.plan.outputs.count }}
      LIST: ${{ needs.plan.outputs.tasks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full/candidate extract Flutter reference goldens from git history; the fast lane has no picture tests.
          fetch-depth: ${{ (needs.plan.outputs.lane == 'full' || needs.plan.outputs.lane == 'candidate') && '0' || '1' }}
          clean: ${{ needs.plan.outputs.lane == 'candidate' || runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/native-setup
        with:
          goldens: ${{ (needs.plan.outputs.lane == 'full' || needs.plan.outputs.lane == 'candidate') && 'true' || 'false' }}
      - name: Stop this workspace's Gradle daemon when the run is cancelled
        if: ${{ cancelled() && runner.environment == 'self-hosted' }}
        working-directory: ${{ github.workspace }}
        run: |
          for p in $(pgrep -f GradleDaemon || true); do
            if ls -l "/proc/$p/fd" 2>/dev/null | grep -q "$GITHUB_WORKSPACE/native/"; then kill -9 "$p" 2>/dev/null || true; fi
          done
      - name: Pick this shard's modules
        id: pick
        run: |
          if [ "$MODE" = list ]; then all="$(printf '%s\n' $LIST)"; else all="$(tool/ci/shard_tasks.sh 0 1)"; fi
          if [ "$LANE" = candidate ] && [ "${{ matrix.shard }}" = "$COUNT" ]; then
            tasks=":quality:test :quality:secTest"
          elif [ "$LANE" = fast ] && [ "${{ matrix.shard }}" = "$COUNT" ]; then
            tasks=":quality:test :quality:secTest"
          else
            # Security belongs to the same worker as quality. Full rotates quality; fast/candidate have a dedicated shard.
            if [[ "$LANE" = fast || "$LANE" = candidate ]]; then omit='^:quality:(test|secTest)$'; else omit='^:quality:secTest$'; fi
            tasks="$(printf '%s\n' "$all" | grep -vE "$omit" | awk -v i=${{ matrix.shard }} -v n="$COUNT" 'NF && (c++ % n) == i' | tr '\n' ' ')"
            case " $tasks " in *" :quality:test "*) tasks="$tasks :quality:secTest" ;; esac
          fi
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          echo "$tasks" | tr ' ' '\n' | sed 's/^/  /'
      - name: Run desktop tests
        # Never fails the job: the summary job is the gate and reds the run only for new-vs-base failures.
        id: gradle
        continue-on-error: true
        if: ${{ steps.pick.outputs.tasks != '' }}
        shell: bash
        run: |
          set -o pipefail
          flags=""; [ "$LANE" = fast ] && flags="-PskipGoldens=true"
          if [ "$LANE" = candidate ]; then
            flags="-I tool/ci/candidate.init.gradle -PskipGoldens=false -PonlyGoldens=false -Poc.recordGoldens=false -PrunQuarantined=true"
          fi
          echo "TEST_FLAGS=$flags" >> "$GITHUB_ENV"
          tool/ci/gradle_retry.sh "$RUNNER_TEMP/gradle.log" ${{ steps.pick.outputs.tasks }} $flags $GRADLE_FLAGS
      - name: Candidate build-logic tests
        if: ${{ always() && needs.plan.outputs.lane == 'candidate' && matrix.shard == fromJSON(needs.plan.outputs.count) }}
        continue-on-error: true
        run: |
          rc=0
          flags="-I $GITHUB_WORKSPACE/native/tool/ci/candidate.init.gradle -PskipGoldens=false -PonlyGoldens=false -Poc.recordGoldens=false -PrunQuarantined=true"
          tool/ci/gradle_retry.sh "$RUNNER_TEMP/build-logic.log" -p build-logic :convention:test $flags $GRADLE_FLAGS || rc=$?
          outcome=success; [ "$rc" = 0 ] || outcome=failure
          (cd build-logic && TEST_FLAGS="$flags" GRADLE_OUTCOME="$outcome" GRADLE_LOG="$RUNNER_TEMP/build-logic.log" TASKS=":convention:test" \
            python3 -I ../tool/ci/test_report.py build-logic ../reports) >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Gradle must have run
        # The step above never fails the job (the summary is the gate for test failures), so an infrastructure failure -
        # Gradle never started, e.g. a 504 on the distribution - would look like a pass. Fail here when no task ran.
        if: ${{ steps.pick.outputs.tasks != '' }}
        shell: bash
        run: |
          log="$RUNNER_TEMP/gradle.log"
          if ! grep -Eq '^(> Task :|BUILD (SUCCESSFUL|FAILED))' "$log" 2>/dev/null; then
            echo "::error::Gradle did not run for this shard (no task and no BUILD line in the log)"; tail -n 20 "$log" 2>/dev/null; exit 1
          fi
          # -print -quit, not a pipe into grep -q: with pipefail, grep leaving at the first match kills find (SIGPIPE)
          # and the pipeline reads as "nothing found" on shards with many result files.
          if [ "${{ steps.gradle.outcome }}" = success ] && [ -z "$(find . -path '*/build/test-results/*' -name 'TEST-*.xml' -size +0 -print -quit 2>/dev/null)" ]; then
            echo "::error::Gradle succeeded but left no test result XML"; exit 1
          fi
      - name: Summarise results
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PICK_OUTCOME: ${{ steps.pick.outcome }}
          GRADLE_OUTCOME: ${{ steps.gradle.outcome }}
          GRADLE_LOG: ${{ runner.temp }}/gradle.log
          TASKS: ${{ steps.pick.outputs.tasks }}
        run: python3 -I tool/ci/test_report.py "${LANE}-${{ matrix.shard }}" reports >> "$GITHUB_STEP_SUMMARY"
      - name: Verdict inputs in the log (read back when GitHub refuses artifact downloads)
        if: always()
        run: bash tool/ci/verdict_log.sh reports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-test-${{ matrix.shard }}
          path: native/reports/report-*.json
          retention-days: ${{ (github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/') || inputs.lane == 'candidate') && 14 || 3 }}
          if-no-files-found: ignore
      - name: Upload test reports
        if: ${{ steps.gradle.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.shard }}
          path: |
            native/**/build/reports/tests/
            native/**/build/test-results/
          retention-days: ${{ (github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/') || inputs.lane == 'candidate') && 7 || 3 }}
          if-no-files-found: ignore

  record:
    name: record goldens
    needs: where
    if: ${{ inputs.lane == 'goldens' && inputs.tasks == '' && !inputs.apk_only }}
    # On work branches this job never fails by itself (every shard still reports); the summary job's verdict reds the run.
    continue-on-error: ${{ github.ref_name != 'native/next' && !startsWith(github.ref_name, 'native/screens-merge') && github.ref_name != 'master' }}
    runs-on: ${{ fromJSON(needs.where.outputs.runs_on) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Self-hosted keeps the build/ trees and the vendored AAR between runs (the warm start); hosted starts clean anyway.
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/native-setup
      - name: Stop this workspace's Gradle daemon when the run is cancelled
        if: ${{ cancelled() && runner.environment == 'self-hosted' }}
        working-directory: ${{ github.workspace }}
        run: |
          for p in $(pgrep -f GradleDaemon || true); do
            if ls -l "/proc/$p/fd" 2>/dev/null | grep -q "$GITHUB_WORKSPACE/native/"; then kill -9 "$p" 2>/dev/null || true; fi
          done
      - name: Re-record the desktop goldens on this runner
        # Every module that wires oc.goldens.record. -PrunQuarantined records quarantined pictures too.
        run: |
          tasks="$(grep -l recordGoldens */*/build.gradle.kts | sed 's|/build.gradle.kts||; s|^|:|; s|/|:|g; s|$|:desktopTest|' | tr '\n' ' ')"
          echo "recording: $tasks"
          tool/ci/gradle_retry.sh "$RUNNER_TEMP/record.log" $tasks -Poc.recordGoldens=true -PonlyGoldens=true -PrunQuarantined=true $GRADLE_FLAGS
      - name: Pack the recorded images
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          find native -path '*/src/desktopTest/goldens/*' -type f | sort > "$RUNNER_TEMP/files.txt"
          tar czf "$RUNNER_TEMP/ci-goldens.tgz" -T "$RUNNER_TEMP/files.txt"
          mkdir -p native/reports
          python3 -I -c "import json,sys; json.dump({'files': len(open(sys.argv[1]).read().split())}, open('native/reports/record.json','w'))" "$RUNNER_TEMP/files.txt"
          cp "$RUNNER_TEMP/ci-goldens.tgz" native/reports/
          { echo "### Recorded goldens"; echo; echo "$(wc -l < "$RUNNER_TEMP/files.txt") images. Download artifact \`ci-goldens\`, then from the repo root: \`tar xzf ci-goldens.tgz\`."; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ci-goldens
          path: native/reports/ci-goldens.tgz
          retention-days: ${{ (github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/') || inputs.lane == 'candidate') && 14 || 3 }}
          if-no-files-found: error
      - name: Verdict inputs in the log (read back when GitHub refuses artifact downloads)
        if: always()
        run: bash tool/ci/verdict_log.sh reports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-record
          path: native/reports/record.json
          retention-days: ${{ (github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/') || inputs.lane == 'candidate') && 7 || 3 }}
          if-no-files-found: ignore

  apk:
    name: apk
    needs: where
    if: ${{ inputs.tasks == '' && inputs.lane != 'goldens' && (inputs.lane != 'candidate' || inputs.apk_only) }}
    # On work branches this job never fails by itself (every shard still reports); the summary job's verdict reds the run.
    continue-on-error: ${{ github.ref_name != 'native/next' && !startsWith(github.ref_name, 'native/screens-merge') && github.ref_name != 'master' }}
    runs-on: ${{ fromJSON(needs.where.outputs.runs_on) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Self-hosted keeps the build/ trees and the vendored AAR between runs (the warm start); hosted starts clean anyway.
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/native-setup
      - name: Stop this workspace's Gradle daemon when the run is cancelled
        if: ${{ cancelled() && runner.environment == 'self-hosted' }}
        working-directory: ${{ github.workspace }}
        run: |
          for p in $(pgrep -f GradleDaemon || true); do
            if ls -l "/proc/$p/fd" 2>/dev/null | grep -q "$GITHUB_WORKSPACE/native/"; then kill -9 "$p" 2>/dev/null || true; fi
          done
      - name: Preview signing key (pre-release builds only; owner-approved 2026-11-08)
        env:
          KEYSTORE_B64: ${{ secrets.NATIVE_PREVIEW_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$RUNNER_TEMP/android-home"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android-home/debug.keystore"
            echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-home" >> "$GITHUB_ENV"
            echo "preview key installed"
          else
            echo "no preview key secret: the APK is signed with the runner's own debug key"
          fi
      - name: Build previewBenchmark APK (preview-signed, lintVital skipped)
        run: |
          cat > "$RUNNER_TEMP/no-lint-vital.init.gradle" <<'EOT'
          allprojects { tasks.configureEach { if (name.startsWith("lintVital")) enabled = false } }
          EOT
          set -o pipefail
          tool/ci/gradle_retry.sh "$RUNNER_TEMP/apk.log" :androidApp:assemblePreviewBenchmark :benchmark:assembleBenchmark -I "$RUNNER_TEMP/no-lint-vital.init.gradle" $GRADLE_FLAGS
      - name: Check the APK signer
        env:
          HAS_KEY: ${{ secrets.NATIVE_PREVIEW_KEYSTORE_B64 != '' }}
        run: |
          apk=$(ls androidApp/build/outputs/apk/preview/benchmark/*.apk | head -1)
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          signer=$("$bt/apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256' | awk '{print $NF}')
          echo "signer ${signer:0:8}"
          if [ "$HAS_KEY" = "true" ] && [ "${signer:0:8}" != "12de0107" ]; then
            echo "::error::APK is not signed with the preview key"; exit 1
          fi
      - name: Upload APK
        # Only on request (apk=true or apk_only), on master and on tags: a quick lane's 100 MB APK was 93% of a day's artifacts.
        if: ${{ inputs.apk == true || inputs.apk_only == true || github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-previewBenchmark-apk
          path: |
            native/androidApp/build/outputs/apk/**/*.apk
            native/benchmark/build/outputs/apk/**/*.apk
          retention-days: ${{ (github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/') || inputs.lane == 'candidate') && 7 || 3 }}
          if-no-files-found: error
      - name: Upload APK for the phone sync (native/next only)
        # The PC's phone-sync timer (phone-sync.sh on the maintainer PC) polls for this artifact name. Dispatch with
        # apk_only=true after each merge into native/next: the commits carry [skip ci], so a push does not trigger.
        if: ${{ github.ref == 'refs/heads/native/next' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-next-apk
          path: native/androidApp/build/outputs/apk/**/*.apk
          retention-days: ${{ (github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/') || inputs.lane == 'candidate') && 7 || 3 }}
          if-no-files-found: error
      - name: APK report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          UPLOADED: ${{ inputs.apk == true || inputs.apk_only == true || github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          mkdir -p reports
          failed=false; [ "$JOB_STATUS" = failure ] && failed=true
          ran=false; grep -Eq '^(> Task :|BUILD )' "$RUNNER_TEMP/apk.log" 2>/dev/null && ran=true
          art=native-previewBenchmark-apk; [ "$UPLOADED" = true ] || art="(built, not uploaded: dispatch with apk=true)"
          apk=$(ls androidApp/build/outputs/apk/preview/benchmark/*.apk 2>/dev/null | head -1 || true)
          if [ -n "$apk" ]; then
            printf '{"artifact":"%s","file":"%s","mb":%s,"failed":%s,"gradle_ran":%s}' "$art" "$(basename "$apk")" "$(du -m "$apk" | cut -f1)" "$failed" "$ran" > reports/apk.json
          else echo "{\"failed\":$failed,\"gradle_ran\":$ran}" > reports/apk.json; fi
      - name: Verdict inputs in the log (read back when GitHub refuses artifact downloads)
        if: always()
        run: bash tool/ci/verdict_log.sh reports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-apk
          path: native/reports/apk.json
          retention-days: ${{ (github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/') || inputs.lane == 'candidate') && 7 || 3 }}
          if-no-files-found: ignore

  custom:
    name: custom tasks
    needs: where
    if: ${{ inputs.tasks != '' && !startsWith(inputs.tasks, 'owner_build ') }}
    # On work branches this job never fails by itself (every shard still reports); the summary job's verdict reds the run.
    continue-on-error: ${{ github.ref_name != 'native/next' && !startsWith(github.ref_name, 'native/screens-merge') && github.ref_name != 'master' }}
    runs-on: ${{ fromJSON(needs.where.outputs.runs_on) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Self-hosted keeps the build/ trees and the vendored AAR between runs (the warm start); hosted starts clean anyway.
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/native-setup
      - name: Stop this workspace's Gradle daemon when the run is cancelled
        if: ${{ cancelled() && runner.environment == 'self-hosted' }}
        working-directory: ${{ github.workspace }}
        run: |
          for p in $(pgrep -f GradleDaemon || true); do
            if ls -l "/proc/$p/fd" 2>/dev/null | grep -q "$GITHUB_WORKSPACE/native/"; then kill -9 "$p" 2>/dev/null || true; fi
          done
      - name: Run the custom tasks
        shell: bash
        env:
          CUSTOM_TASKS: ${{ inputs.tasks }}
          OC_REFERENCES: ${{ inputs.references }}
        run: |
          set -o pipefail
          case "$CUSTOM_TASKS" in
            detekt|"detekt "*)
              # `tasks=detekt :core:net :androidApp` (or `detekt --all`): the detekt lane script on exactly those modules, no Gradle.
              # deep enough for the merge-base of the branch and the ref (the ratchet judges a branch from its fork)
              git -C .. fetch --no-tags --depth=1000 origin native/glass-next:refs/remotes/origin/native/glass-next "$GITHUB_REF_NAME" || true
              bash tool/ci/detekt_lane.sh origin/native/glass-next ${CUSTOM_TASKS#detekt} 2>&1 | tee "$RUNNER_TEMP/custom.log"
              exit 0 ;;
          esac
          tool/ci/gradle_retry.sh "$RUNNER_TEMP/custom.log" ${{ inputs.tasks }} $GRADLE_FLAGS
      - name: Pack the goldens this run changed or added (a record run's result)
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git status --porcelain --untracked-files=all -- 'native/*/src/desktopTest/goldens/*' 'native/*/*/src/desktopTest/goldens/*' | cut -c4- > "$RUNNER_TEMP/changed-goldens.txt" || true
          mkdir -p native/reports
          if [ -s "$RUNNER_TEMP/changed-goldens.txt" ]; then tar czf native/reports/goldens-custom.tgz -T "$RUNNER_TEMP/changed-goldens.txt"; cat "$RUNNER_TEMP/changed-goldens.txt" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-goldens-custom
          path: native/reports/goldens-custom.tgz
          retention-days: 7
          if-no-files-found: ignore
      - name: Custom report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p reports
          failed=false; [ "$JOB_STATUS" = failure ] && failed=true
          ran=false; grep -Eq '^(> Task :|BUILD )' "$RUNNER_TEMP/custom.log" 2>/dev/null && ran=true
          echo "{\"failed\":$failed,\"gradle_ran\":$ran}" > reports/custom.json
          case "${{ inputs.tasks }}" in
            # no Gradle: "ran" is whether the lane script left its report, which summary.py reads
            detekt|"detekt "*) ran=false; [ -s reports/detekt.json ] && ran=true; failed=false; [ "$ran" = false ] && failed=true
              echo "{\"failed\":$failed,\"gradle_ran\":$ran}" > reports/custom.json ;;
            *) TASKS="${{ inputs.tasks }}" GRADLE_LOG="$RUNNER_TEMP/custom.log" GRADLE_OUTCOME="$JOB_STATUS" \
                 python3 -I tool/ci/test_report.py custom reports >> "$GITHUB_STEP_SUMMARY" ;;
          esac
      - name: Verdict inputs in the log (read back when GitHub refuses artifact downloads)
        if: always()
        run: bash tool/ci/verdict_log.sh reports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-custom
          path: |
            native/reports/custom.json
            native/reports/report-custom.json
            native/reports/detekt.json
            native/build/reports/detekt/
          retention-days: ${{ (github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/') || inputs.lane == 'candidate') && 7 || 3 }}
          if-no-files-found: ignore

  detekt:
    name: detekt
    needs: where
    # No Gradle: the pinned detekt jar on the modules this change touches (and the baseline ratchet), so a branch cannot read
    # PASS with a new finding. It records; summary.py decides (the job is continue-on-error on work branches like the rest).
    if: ${{ inputs.tasks == '' && !inputs.apk_only && inputs.lane != 'goldens' }}
    continue-on-error: ${{ github.ref_name != 'native/next' && !startsWith(github.ref_name, 'native/screens-merge') && github.ref_name != 'master' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.lane == 'candidate' && 45 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch the base the diff and the ratchet compare with
        env:
          BASE: ${{ inputs.base || 'native/screens-merge41' }}
        run: |
          printf '%s' "$BASE" | grep -Eq '^[0-9a-f]{7,40}$' || git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" || true
      - name: detekt on the touched modules
        working-directory: native
        env:
          BASE: ${{ inputs.base || 'native/screens-merge41' }}
          LANE: ${{ inputs.lane || 'full' }}
        run: |
          if printf '%s' "$BASE" | grep -Eq '^[0-9a-f]{7,40}$'; then ref="$BASE"; else ref="origin/$BASE"; fi
          # The candidate lane checks every module; the fast and full lanes the modules this change touches.
          all=(); [ "$LANE" = candidate ] && all=(--all)
          bash tool/ci/detekt_lane.sh "$ref" "${all[@]}" | tee "$RUNNER_TEMP/detekt.log"
          python3 -I - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open('reports/detekt.json'))
          print('### detekt: ' + (', '.join(f'{m}: {n} new' for m, n in sorted(r['findings'].items())) or '0 new findings')
                + f' on {", ".join(r["modules"]) or "ratchet only"} (ratchet {r["ratchet"]}, scope {r["scope"]})')
          PY
      - name: Verdict inputs in the log (read back when GitHub refuses artifact downloads)
        if: always()
        run: bash tool/ci/verdict_log.sh reports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-detekt
          path: |
            native/reports/detekt.json
            native/build/reports/detekt/
          retention-days: ${{ (github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/') || inputs.lane == 'candidate') && 7 || 3 }}
          if-no-files-found: ignore
      # The JUnit files of the custom run, so a test's duration can be read after the run (small: xml only).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-junit-custom
          path: native/**/build/test-results/**/*.xml
          retention-days: 7
          if-no-files-found: ignore

  android-unit:
    name: android unit tests
    needs: where
    env:
      LANE: ${{ inputs.lane || 'full' }}
    # Part of fast/full/candidate and every push run (a push has no inputs); counts in the summary verdict like the
    # desktop shards. Candidate always includes KMP Android host tests too. Other lanes may opt out with android_unit; a tasks-only, apk-only or goldens run never runs them.
    if: ${{ inputs.tasks == '' && !inputs.apk_only && inputs.lane != 'goldens' && (github.event_name == 'push' || inputs.android_unit == true || inputs.lane == 'candidate') }}
    continue-on-error: ${{ github.ref_name != 'native/next' && !startsWith(github.ref_name, 'native/screens-merge') && github.ref_name != 'master' }}
    runs-on: ${{ fromJSON(needs.where.outputs.runs_on) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: ${{ inputs.lane == 'candidate' || runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/native-setup
      - name: Run the Android unit tests
        shell: bash
        run: |
          set -o pipefail
          # Every android/* library that has unit tests, plus the app module. The list comes from the folders, so a new
          # module is picked up without editing this file. The `test` task runs each module's tested build type
          # (debug for most; :android:migration tests on `qa`, which has no testDebugUnitTest).
          tasks="$(bash tool/ci/android_tasks.sh "$LANE" | tr '\n' ' ')"
          flags=""
          if [ "$LANE" = candidate ]; then
            flags="-I tool/ci/candidate.init.gradle -PskipGoldens=false -PonlyGoldens=false -Poc.recordGoldens=false -PrunQuarantined=true"
          fi
          echo "AU_TASKS=$tasks" >> "$GITHUB_ENV"
          echo "TEST_FLAGS=$flags" >> "$GITHUB_ENV"
          tool/ci/gradle_retry.sh "$RUNNER_TEMP/android-unit.log" $tasks $flags $GRADLE_FLAGS
      - name: Android unit report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p reports
          failed=false; [ "$JOB_STATUS" = failure ] && failed=true
          ran=false; grep -Eq '^(> Task :|BUILD )' "$RUNNER_TEMP/android-unit.log" 2>/dev/null && ran=true
          # The failing tests and tasks, in words, for the summary (test_report.py reads the JUnit XML and the Gradle log).
          mkdir -p "$RUNNER_TEMP/au"
          GRADLE_LOG="$RUNNER_TEMP/android-unit.log" TASKS="$AU_TASKS" JOB_STATUS="$JOB_STATUS" \
            python3 -I tool/ci/test_report.py android-unit "$RUNNER_TEMP/au" >> "$GITHUB_STEP_SUMMARY"
          if [ "$LANE" = candidate ]; then cp "$RUNNER_TEMP/au/report-android-unit.json" reports/; fi
          python3 -I - "$RUNNER_TEMP/au/report-android-unit.json" "$failed" "$ran" > reports/android-unit.json <<'PY'
          import json, sys
          try:
              r = json.load(open(sys.argv[1]))
          except OSError:
              r = {}
          print(json.dumps({'failed': sys.argv[2] == 'true', 'gradle_ran': sys.argv[3] == 'true', 'tests': r.get('tests', 0),
                            'failing': [f['id'] for f in r.get('failures', [])][:40], 'real': r.get('real_failures', [])[:20]}))
          PY
      - name: Verdict inputs in the log (read back when GitHub refuses artifact downloads)
        if: always()
        run: bash tool/ci/verdict_log.sh reports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-android-unit
          path: |
            native/reports/android-unit.json
            native/reports/report-android-unit.json
          retention-days: ${{ (github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/') || inputs.lane == 'candidate') && 7 || 3 }}
          if-no-files-found: ignore
      - name: Android unit and picture evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-android-unit
          path: |
            native/**/build/reports/tests/
            native/**/build/test-results/
            native/**/build/outputs/roborazzi/
          retention-days: ${{ (github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/') || inputs.lane == 'candidate') && 7 || 3 }}
          if-no-files-found: ignore

  # `tasks=owner_build <full sha> <versionCode> [abis] [mapping]`: the owner-key build compiled HERE, UNSIGNED, and signed afterwards on the
  # maintainer's own PC (build-takeover-gh.sh). It holds NO signing secret and writes NO key file: the release APKs come out unsigned,
  # exactly as the build server's owner build leaves them (androidApp/build.gradle.kts leaves the release APK unsigned when no key
  # file is given). The only secret read is FIREBASE_GOOGLE_SERVICES_B64 (Crashlytics config, not a signing key), installed the way
  # native-release.yml installs it and never printed. Same build as build-takeover-remote.sh: :androidApp:assembleSwitchRelease, no
  # -Poc.publicRelease (version name <name>-test.<code>), the versionCode written into the runner's copy of version.properties only.
  # (Its own workflow file cannot be dispatched from a branch: only a workflow already on the default branch can.)
  owner-build:
    name: owner build (unsigned)
    if: ${{ startsWith(inputs.tasks, 'owner_build ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: native-owner-build-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Check the request and check out the commit to build
        id: req
        env:
          TASKS: ${{ inputs.tasks }}
        run: |
          set -euo pipefail
          read -r _ sha code abis mapping <<<"$TASKS"
          abis="${abis:-arm64-v8a}"; mapping="${mapping:-false}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the commit must be a full 40-character sha"; exit 1; }
          [[ "$code" =~ ^[0-9]+$ ]] || { echo "::error::the code must be a number"; exit 1; }
          for a in ${abis//,/ }; do
            case "$a" in arm64-v8a|x86_64|universal) ;; *) echo "::error::unknown abi $a"; exit 1 ;; esac
          done
          git fetch --no-tags --depth=1 origin "$sha"
          git checkout -q --detach "$sha"
          echo "building $(git rev-parse HEAD)"
          { echo "code=$code"; echo "abis=$abis"; echo "mapping=$mapping"; } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/native-setup
      - name: Write the build number into this runner's copy
        working-directory: ${{ github.workspace }}
        env:
          CODE: ${{ steps.req.outputs.code }}
        run: sed -i "s/^versionCode=.*/versionCode=$CODE/" native/version.properties
      - name: Install the Firebase config (never in git, never printed)
        env:
          FIREBASE_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_B64 }}
        run: |
          set -euo pipefail
          [ -n "$FIREBASE_B64" ] || { echo "::error::FIREBASE_GOOGLE_SERVICES_B64 is not set"; exit 1; }
          dir="$RUNNER_TEMP/oc-firebase"
          mkdir -p "$dir"
          printf '%s' "$FIREBASE_B64" | base64 -d > "$dir/google-services-io.github.eslamasabry.opencode_mobile.json"
          echo "OC_GOOGLE_SERVICES_DIR=$dir" >> "$GITHUB_ENV"
          echo "Firebase config installed"
      - name: Compile the unsigned switch release
        working-directory: ${{ github.workspace }}/native
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          start=$(date +%s)
          ./gradlew --console=plain "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8" :androidApp:assembleSwitchRelease
          secs=$(( $(date +%s) - start ))
          echo "OWNER-BUILD-COMPILE-SECONDS $secs"
          echo "### Compile on the runner: ${secs} s" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete the Firebase config
        if: always()
        run: rm -rf "$RUNNER_TEMP/oc-firebase"
      - name: Collect the unsigned APKs and print their sha256
        id: collect
        working-directory: ${{ github.workspace }}
        env:
          ABIS: ${{ steps.req.outputs.abis }}
          MAPPING: ${{ steps.req.outputs.mapping }}
        run: |
          set -euo pipefail
          src=native/androidApp/build/outputs/apk/switch/release
          out="$RUNNER_TEMP/owner-out"; mkdir -p "$out"
          want="arm64-v8a ${ABIS//,/ }"
          for abi in $(printf '%s\n' $want | sort -u); do
            f=$(ls -t "$src"/*-"$abi"-release*.apk 2>/dev/null | head -1 || true)
            [ -n "$f" ] || { echo "::error::no $abi APK in $src"; ls "$src"; exit 1; }
            cp "$f" "$out/$abi.apk"
            echo "OWNER-BUILD-SHA256 $abi $(sha256sum "$out/$abi.apk" | cut -d' ' -f1) $(stat -c %s "$out/$abi.apk")"
          done
          if [ "$MAPPING" = true ]; then
            m=native/androidApp/build/outputs/mapping/switchRelease/mapping.txt
            if [ -f "$m" ]; then gzip -1 -c "$m" > "$out/mapping.txt.gz"; else echo "::warning::no mapping file"; fi
          fi
          echo "dir=$out" >> "$GITHUB_OUTPUT"
      - name: Upload the unsigned arm64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owner-unsigned-arm64-${{ steps.req.outputs.code }}
          path: ${{ steps.collect.outputs.dir }}/arm64-v8a.apk
          retention-days: 1
          if-no-files-found: error
      - name: Upload the other unsigned APKs (only when asked)
        if: ${{ contains(steps.req.outputs.abis, 'x86_64') || contains(steps.req.outputs.abis, 'universal') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owner-unsigned-others-${{ steps.req.outputs.code }}
          path: |
            ${{ steps.collect.outputs.dir }}/x86_64.apk
            ${{ steps.collect.outputs.dir }}/universal.apk
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload the R8 mapping (only when asked)
        if: ${{ steps.req.outputs.mapping == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owner-mapping-${{ steps.req.outputs.code }}
          path: ${{ steps.collect.outputs.dir }}/mapping.txt.gz
          retention-days: 1
          if-no-files-found: ignore

  summary:
    name: summary
    needs: [where, plan, compile, test, apk, record, custom, android-unit, detekt]
    if: ${{ always() && !startsWith(inputs.tasks, 'owner_build ') }}
    # No job-level continue-on-error: this job's exit code is summary.py's verdict on every branch (1 = FAIL, 2 = integrity:
    # Gradle never ran, a shard left no report), so the run page reads red exactly when the summary says FAIL.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RESULT_COMPILE: ${{ needs.compile.result }}
      RESULT_TEST: ${{ needs.test.result }}
      RESULT_APK: ${{ needs.apk.result }}
      RESULT_RECORD: ${{ needs.record.result }}
      RESULT_CUSTOM: ${{ needs.custom.result }}
      RESULT_ANDROID_UNIT: ${{ needs.android-unit.result }}
      RESULT_DETEKT: ${{ needs.detekt.result }}
      PLANNED_SHARDS: ${{ join(fromJSON(needs.plan.outputs.shards || '[]'), ',') }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: native/tool/ci
      - name: Collect this run's reports and the base branch's last ones
        env:
          BASE: ${{ inputs.base || 'native/screens-merge41' }}
        run: |
          # a sha base (native/next batcher) has no runs of its own: compare with the newest native/next run instead
          if printf '%s' "$BASE" | grep -Eq '^[0-9a-f]{7,40}$'; then BASE=native/next; fi
          mkdir -p reports base
          gh run download "${{ github.run_id }}" -p 'report-*' -D reports || true
          for id in $(gh run list --workflow native-ci.yml --branch "$BASE" --status completed --limit 10 --json databaseId -q '.[].databaseId'); do
            [ "$id" = "${{ github.run_id }}" ] && continue
            if gh run download "$id" -p 'report-test-*' -D base 2>/dev/null && [ -n "$(find base -name 'report-*.json' | head -1)" ]; then
              echo "base reports from run $id" ; break
            fi
          done
      - name: Summary table
        run: |
          lane="${{ inputs.lane || 'full (push)' }}"; [ -n "${{ inputs.tasks }}" ] && lane="custom tasks"; [ "${{ inputs.apk_only }}" = true ] && lane="apk only"
          rc=0; python3 -I native/tool/ci/summary.py reports base "$lane" >> "$GITHUB_STEP_SUMMARY" || rc=$?
          # The verdict as a small file for scripts/native-release.sh (it reads this, never a job colour): which commit,
          # which lane, whether the Android unit tests were part of it, and summary.py's exit code (0 = PASS).
          python3 -I - "$rc" "$lane" "${{ github.sha }}" "${{ needs.android-unit.result }}" "${{ needs.test.result }}" "${{ needs.compile.result }}" "${{ needs.custom.result }}" > verdict.json <<'PY'
          import glob, json, sys
          rc, lane, sha, android, test, compile_, custom = sys.argv[1:8]
          evidence = [json.load(open(p)).get('security', {}) for p in glob.glob('reports/**/report-*.json', recursive=True)]
          security = any(s.get('executed') and s.get('full') and s.get('tests', 0) > 0 and s.get('failed') == 0 and s.get('skipped') == 0 for s in evidence)
          security = security and not any(s.get('failed', 0) or s.get('skipped', 0) for s in evidence)
          guards_skipped = sum(json.load(open(p)).get('guards_skipped', 0) for p in glob.glob('reports/**/report-*.json', recursive=True))
          print(json.dumps({'sha': sha, 'lane': lane, 'exit': int(rc), 'guards_skipped': guards_skipped, 'android_unit': android not in ('', 'skipped'),
                            'desktop_tests': test not in ('', 'skipped'), 'compile': compile_ not in ('', 'skipped'),
                            'custom_tasks': custom not in ('', 'skipped'), 'security': security,
                            'candidate_complete': lane == 'candidate' and int(rc) == 0}))
          PY
          if [ "$rc" = 2 ]; then echo "::error::Native CI integrity failure: Gradle did not run or reports are missing (see the summary)"; exit 1; fi
          # FAIL (1) reds the run on every branch, work branches included, so a run whose own summary says FAIL never
          # reads green. The individual jobs stay continue-on-error on work branches, so every shard still reports.
          exit "$rc"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ci-verdict
          path: verdict.json
          retention-days: 90
          if-no-files-found: ignore

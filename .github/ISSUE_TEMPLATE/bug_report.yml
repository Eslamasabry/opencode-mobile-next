name: Bug report
description: Something in the Android app is broken
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        **OpenCode Mobile is an independent community project. It is not
        built, maintained, endorsed by, or affiliated with the official
        OpenCode team.** Bugs in the OpenCode server itself belong upstream,
        not here — see [SUPPORT.md](https://github.com/Eslamasabry/oc_app/blob/master/SUPPORT.md).

        ⚠️ **Do not report a security vulnerability here.** This app stores
        server credentials and can authorize shell-capable actions. Report
        privately through a
        [security advisory](https://github.com/Eslamasabry/oc_app/security/advisories/new).

        ⚠️ **Redact before you paste.** No server passwords, no provider API
        keys, no real server hostnames, no unredacted transcripts.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before filing
      options:
        - label: I am on the current preview release (older previews are not supported)
          required: true
        - label: I searched existing issues
          required: true
        - label: This is not a security vulnerability
          required: true
        - label: I reproduced this against the OpenCode server, not only in my head, and it is the app that misbehaves — not the server or the model
          required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
      placeholder: |
        1. Opened Activity with two pending permissions
        2. Tapped the second row
        3. Expected the permission sheet for that request; got the first one
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings → About (e.g. 1.0.29+30-preview.9)
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: Android 15, Pixel 6
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: How is the app reaching the server?
      options:
        - adb reverse (USB)
        - SSH port forward
        - HTTPS / TLS reverse proxy or Tailscale Serve
        - On-device (Termux)
        - Other / not sure
    validations:
      required: true

  - type: input
    id: server
    attributes:
      label: OpenCode server version
      description: And whether it is v1 or the v2 beta.
      placeholder: 1.18.23 (v1)
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Rarely / once
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Diagnostics or logs
      description: |
        Optional. The app's redacted diagnostics (Settings → App diagnostics)
        or `adb logcat` output. Check it for anything sensitive before
        pasting — redaction is best-effort, not a guarantee.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, a recording, whether it started after an update.

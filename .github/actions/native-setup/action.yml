name: Native toolchain
description: JDK 17 + 21, Android SDK 37.1, Gradle cache and the vendored sherpa-onnx AAR for native/
inputs:
  goldens:
    description: Extract the pinned Flutter reference goldens (needs full git history)
    default: 'false'
runs:
  using: composite
  steps:
    # The self-hosted oc-native runner already has the JDK, the SDK and a persistent GRADLE_USER_HOME (runner .env).
    - name: Set up JDK 17 and 21 (build 17, host-test launcher 21)
      if: runner.environment != 'self-hosted'
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: temurin
        java-version: |
          17
          21
    - name: Android SDK platform 37.1
      if: runner.environment != 'self-hosted'
      shell: bash
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "platform-tools" >/dev/null
    - name: Gradle memory for a 4 CPU / 16 GB runner
      if: runner.environment != 'self-hosted'
      shell: bash
      run: |
        mkdir -p ~/.gradle
        cat >> ~/.gradle/gradle.properties <<'EOP'
        org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
        org.gradle.workers.max=4
        oc.test.forks=2
        EOP
    - name: Gradle (cached)
      if: runner.environment != 'self-hosted'
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-read-only: false
    - name: Stop a Gradle daemon left over from a cancelled run in this workspace
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        # The warm daemon outlives a job on purpose (RUNNER_TRACKING_ID is empty), so a cancelled run leaves one that still
        # holds this workspace's locks. Only daemons that have files open under this workspace are stopped.
        for p in $(pgrep -f GradleDaemon || true); do
          if ls -l "/proc/$p/fd" 2>/dev/null | grep -q "$GITHUB_WORKSPACE/native/"; then kill "$p" 2>/dev/null || true; echo "stopped stale daemon $p"; fi
        done
        sleep 2
    - name: Cache vendored sherpa-onnx AAR
      if: runner.environment != 'self-hosted'
      id: vendor-cache
      uses: actions/cache@v4
      with:
        path: native/third_party/maven/com/k2fsa/sherpa/onnx/sherpa-onnx-android/2.0.1/sherpa-onnx-android-2.0.1.aar
        key: sherpa-onnx-${{ hashFiles('native/third_party/SHA256SUMS') }}
    - name: Fetch vendored artifacts (hash-pinned, never committed)
      shell: bash
      run: native/tools/vendor/fetch.sh
    - name: Extract Flutter reference goldens from git history
      if: ${{ inputs.goldens == 'true' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        FLUTTER_REPO: ${{ github.workspace }}
        GLASS_REPO: ${{ github.workspace }}
      run: |
        # Non-fatal: refs that are not on this repo's history leave their goldens missing, and the gate tests report that.
        native/tool/design/fetch_all_goldens.sh || true
